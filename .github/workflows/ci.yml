name: CI

# Solo a mano (Julián, 2026-11-17): el repo es privado y los minutos de Actions cuentan. Nada corre
# por push ni por PR; se lanza con `gh workflow run <archivo>` cuando Julián lo pide.
# La validación de cada cambio es la local (lint + typecheck + test) antes del push.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + Typecheck + Test
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # El MISMO pin que scripts/package-release.ts (BUN_VERSION): lo que pasa
          # acá es lo que se publica. Bun toma `experimentalDecorators` (@memoize)
          # del tsconfig del directorio desde el que corre — por eso cada suite
          # corre con `--cwd` de su paquete (issue #80) —, y desde 1.3 instala
          # con el linker isolated: bunfig.toml lo deja en hoisted.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run lint

      - name: Format check
        run: bunx biome format .

      # Las fronteras entre paquetes y carpetas (.dependency-cruiser.cjs): cada
      # regla es una ausencia verificada, con cómo arreglarla en su mensaje.
      - name: Boundaries
        run: bun run lint:boundaries

      # Cubre todos los paquetes y apps del workspace. Un check que no puede
      # fallar no es un check.
      - name: Typecheck (workspace)
        run: bun run typecheck

      # `bun run test` corre TODAS las suites (vitest en los paquetes del
      # engine, bun test en runner-v2 y desktop, vitest en web).
      - name: Test (workspace)
        run: bun run test

      # El bundle del runner como lo arma el release (mismo script): un import que no bundlea, o
      # los decorators de @memoize compilados como TC39, se ven acá y no al publicar el tag.
      - name: Release bundle (runner)
        run: bun run scripts/package-release.ts "0.0.0-ci"
