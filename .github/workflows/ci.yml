name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pineado: Bun 1.4.x cambió el transform de decorators legacy y rompe
          # @memoize (packages/shared/src/cache.ts) + dos tests del logger.
          # Actualizar requiere migrar @memoize primero — ver issue #80.
          bun-version: "1.1.30"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run lint

      - name: Format check
        run: bunx biome format .

      # Cubre los 12 paquetes/apps del workspace, no sólo la web. Antes el
      # typecheck del server corría como "informational" con
      # `continue-on-error`, así que sus errores se acumulaban sin frenar nada:
      # había 37 el día que se los ordenó. Un check que no puede fallar no es
      # un check.
      - name: Typecheck (workspace)
        run: bun run typecheck

      # `bun run test` corre TODAS las suites. Antes CI corría sólo server,
      # shared y web — las de rules, agent-engine, issue-sources, tools,
      # ai-providers, workspace, github-auth, figma-auth, agent-host y desktop
      # no se ejecutaban en ningún lado salvo a mano.
      - name: Test (workspace)
        run: bun run test
