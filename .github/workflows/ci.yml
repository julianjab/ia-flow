name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # El MISMO pin que scripts/package-release.ts (BUN_VERSION): lo que pasa
          # acá es lo que se publica. Bun toma `experimentalDecorators` (@memoize)
          # del tsconfig del directorio desde el que corre — por eso cada suite
          # corre con `--cwd` de su paquete (issue #80) —, y desde 1.3 instala
          # con el linker isolated: bunfig.toml lo deja en hoisted.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run lint

      - name: Format check
        run: bunx biome format .

      # Cubre todos los paquetes y apps del workspace. Un check que no puede
      # fallar no es un check.
      - name: Typecheck (workspace)
        run: bun run typecheck

      # `bun run test` corre TODAS las suites (vitest en los paquetes del
      # engine, bun test en runner-v2 y desktop, vitest en web).
      - name: Test (workspace)
        run: bun run test
