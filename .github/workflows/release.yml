# Construye y publica los artefactos de una release.
#
# Lo dispara el tag que crea `release-please.yml` al mergear su Release PR.
# `workflow_dispatch` está para rehacer una release sin tocar la versión.
#
#   ia-flow-runner.js              el runner headless (`apps/runner-v2`), un bundle
#   ia-flow-runner-<v>.tar.gz      el bundle + Dockerfile.example + VERSION + BUN_VERSION
#   SHA256SUMS                     para `ADD --checksum`
#   IA Flow-<version>-<arch>.dmg   la app de escritorio
#
# No se publican imágenes: el bundle se referencia con un `ADD` desde el
# Dockerfile de cada deploy, sobre su base y con su config.
name: Release

on:
  # Lo llama release-please.yml cuando su Release PR se mergea. NO alcanza con
  # `push: tags`: release-please crea el tag con el `GITHUB_TOKEN`, y GitHub
  # NO dispara workflows a partir de eventos creados con ese token. El tag
  # aparecería y no se publicaría nada — sin ningún run fallido que mirar.
  # `workflow_call` evita eso sin pedir un PAT ni una GitHub App.
  workflow_call:
    inputs:
      tag:
        description: "Tag a publicar (ej. v1.2.3)"
        required: true
        type: string
  # Un tag pusheado a mano por una persona SÍ dispara workflows, así que este
  # camino sigue sirviendo (y es el que hace útil el `git tag` de emergencia).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a reconstruir (ej. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner:
    name: Runner (ia-flow-runner.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # El MISMO pin que scripts/package-release.ts (BUN_VERSION), que
          # además se niega a empaquetar con otro.
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - name: Empaquetar
        run: bun run scripts/package-release.ts "${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Adjuntar a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/artifacts/*.js
            dist/artifacts/*.tar.gz
            dist/artifacts/SHA256SUMS
          append_body: true
          body: |

            ### Runner

            El runner headless (`apps/runner-v2`) es un solo archivo. Se baja
            con un `ADD` desde el Dockerfile de cada deploy, junto a su config:

            ```dockerfile
            FROM oven/bun:1.4.2-slim
            ADD --chown=bun:bun --chmod=644 https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}/ia-flow-runner.js /app/runner.js
            COPY config/ /app/config/
            ENV RUNNER_CONFIG=/app/config IA_FLOW_HOME=/state
            VOLUME ["/state"]
            ENTRYPOINT ["bun", "run", "/app/runner.js", "--serve"]
            ```

            `IA_FLOW_HOME` es donde el runner guarda su base (ejecuciones,
            pausas, conversaciones) y los workspaces: en un volumen, para que
            sobrevivan a un reinicio. El tarball trae un `Dockerfile.example`
            completo (git, usuario `bun`, puerto 3001, `GET /health`).

            Las actions `.ts` de la config importan `@ia-flow/*` y `zod`: el
            bundle se los sirve, no hace falta `node_modules`. Verificá la
            descarga con `SHA256SUMS`. Bun: **1.4.2**.

  desktop:
    # Después del runner: los dos adjuntan a la MISMA Release con
    # `append_body`, que es un read-modify-write del body.
    needs: runner
    name: IA Flow.app (dmg)
    # macOS obligatorio: un .dmg se construye con `hdiutil`, que no existe en
    # Linux. Es también el único job que cuesta minutos de macOS runner.
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Mismo pin que ci.yml y scripts/package-release.ts.
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # electron-builder toma la versión del `package.json` de apps/desktop, no
      # del tag: sin esto el .dmg de v1.4.0 se llamaría "IA Flow-1.0.0.dmg" y
      # la app reportaría una versión que no existe. Se inyecta acá en vez de
      # hacer que release-please mantenga en sync N package.json — el tag ya es
      # la fuente de verdad, y esto no puede desincronizarse.
      - name: Fijar la versión del tag
        run: |
          # `export`, y NO una var de `env:` acá abajo: el tag viene como
          # `v1.2.3` y package.json necesita `1.2.3`. Declarar VERSION en
          # `env:` la haría llegar CON la `v` y pisaría a la despojada.
          export VERSION="${TAG#v}"
          echo "Empaquetando como $VERSION"
          bun -e '
            const p = "apps/desktop/package.json"
            const d = await Bun.file(p).json()
            d.version = process.env.VERSION
            await Bun.write(p, JSON.stringify(d, null, 2) + "\n")
          '
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      # Construye el main, la SPA y el .dmg (arm64 + x64). Sin firmar: no hay
      # Developer ID en este proyecto — ver `identity: null` en
      # electron-builder.yml y la nota de Gatekeeper en las notas de la release.
      #
      # `mdutil -i off` apaga la indexación de Spotlight antes de empaquetar:
      # en macos-14 el volumen recién montado del .dmg queda indexándose y
      # `hdiutil detach` falla de forma intermitente ("Exit code 1/3/16",
      # reintentado 6 veces por electron-builder hasta abortar el build) — es
      # lo que dejó la release v1.2.0 sin .dmg.
      - name: Empaquetar
        run: |
          sudo mdutil -a -i off 2>/dev/null || true
          bun run --cwd apps/desktop dist

      - name: Adjuntar a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/desktop/*.dmg
          # No pisa las notas que escribió release-please.
          append_body: true
          body: |

            ### App de escritorio

            El `.dmg` de abajo no está firmado (este proyecto no tiene
            Developer ID), así que Gatekeeper la bloquea la primera vez.
            Después de arrastrarla a Applications:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/IA Flow.app"
            ```

            Este paso no es sólo para destrabar el primer arranque: mientras
            la app quede en cuarentena (por ejemplo si la abriste con click
            derecho → Abrir en vez de correr el comando) Chromium puede caer a
            renderizado por software, y la app se siente notoriamente más
            lenta al clickear que un browser normal.

            La app no trae server: se conecta al que elijas en su pantalla de
            servers.
