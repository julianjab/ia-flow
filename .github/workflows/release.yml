# Construye y publica los cuatro artefactos de una release.
#
# Lo dispara el tag que crea `release-please.yml` al mergear su Release PR.
# `workflow_dispatch` está para rehacer una release sin tocar la versión (un
# runner de CI que falló, un push a GHCR que se cortó).
#
#   ia-flow-server.js     apps/server, flavor `full`  — la API + WS
#   ia-flow-runner.js     apps/server, flavor `runner` — engine headless
#   ia-flow-gateway.js    apps/ai-provider-gateway
#   IA Flow-<version>-<arch>.dmg   la app de escritorio
#
# Los tres bundles van también como `.tar.gz` con su Dockerfile de ejemplo, y
# hay un SHA256SUMS para verificar. Todo se adjunta a la GitHub Release.
#
# **No se publican imágenes de contenedor.** Una imagen le impone al consumidor
# la base que elegimos nosotros; un bundle de 2 MB se referencia con un `ADD`
# desde el Dockerfile de quien lo usa, sobre la base que ya tenga. Los
# Dockerfiles de containers/ siguen existiendo para construir desde el árbol de
# trabajo, que es otro caso de uso.
#
# Los cuatro salen del MISMO commit y llevan la MISMA versión: el server y el
# runner son literalmente el mismo `apps/server` con otro entrypoint, y la app
# habla con ellos por HTTP. Versionarlos por separado obligaría a razonar sobre
# compatibilidad entre piezas que siempre salen juntas.
name: Release

on:
  # Lo llama release-please.yml cuando su Release PR se mergea. NO alcanza con
  # `push: tags`: release-please crea el tag con el `GITHUB_TOKEN`, y GitHub
  # NO dispara workflows a partir de eventos creados con ese token. El tag
  # aparecería y no se publicaría nada — sin ningún run fallido que mirar.
  # `workflow_call` evita eso sin pedir un PAT ni una GitHub App.
  workflow_call:
    inputs:
      tag:
        description: "Tag a publicar (ej. v1.2.3)"
        required: true
        type: string
  # Un tag pusheado a mano por una persona SÍ dispara workflows, así que este
  # camino sigue sirviendo (y es el que hace útil el `git tag` de emergencia).
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a reconstruir (ej. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Los tres bundles ────────────────────────────────────────────────────
  #
  # Se publican ARTEFACTOS, no imágenes. Una imagen obliga a quien la consume a
  # heredar la base que nosotros elegimos —nuestra Debian, nuestros paquetes,
  # nuestro usuario—; un bundle de 2 MB se referencia con un `ADD` desde el
  # Dockerfile de cualquiera, sobre la base que ya esté usando.
  #
  # Son independientes de arquitectura (es JavaScript), así que no hay matriz de
  # plataformas y esto corre en un solo job de minutos gratis.
  artifacts:
    name: Bundles (server, runner, gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # El MISMO pin que scripts/package-release.ts anuncia adentro de cada
          # artefacto. Si estos dos se separan, publicaríamos un bundle
          # construido con una versión distinta a la que le decimos al
          # consumidor que use.
          bun-version: "1.1.30"

      - run: bun install --frozen-lockfile

      - name: Empaquetar
        run: bun run scripts/package-release.ts "${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Adjuntar a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/artifacts/*.js
            dist/artifacts/*.tar.gz
            dist/artifacts/SHA256SUMS
          append_body: true
          body: |

            ### Server, runner y gateway

            No se publican imágenes: se publica el **bundle**, para que lo
            referencies desde tu propio Dockerfile sobre la base que uses.

            ```dockerfile
            FROM oven/bun:1.1.30-slim
            ADD --chmod=644 https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}/ia-flow-server.js /app/server.js
            ENTRYPOINT ["bun", "run", "/app/server.js"]
            ```

            Cada `.tar.gz` trae el mismo bundle más un `Dockerfile.example`
            completo (git, `/state`, non-root) y un `README.md`. Verificá la
            descarga con `SHA256SUMS`.

            **La versión de Bun no es libre:** el bundle está probado con
            `1.1.30`. Bun 1.4.x rompe `@memoize` —que está en el grafo de las
            tres apps— y lo hace sin ningún error visible.

  # ── La app de escritorio ─────────────────────────────────────────────────
  desktop:
    name: IA Flow.app (dmg)
    # `needs`, y no por dependencia de artefactos: los dos jobs adjuntan a la
    # MISMA Release con `append_body: true`, que es un read-modify-write del
    # body. En paralelo, el que termina segundo pisa el texto del primero — y
    # si la Release todavía no existe, los dos intentan crearla y uno se lleva
    # un 422. Serializarlos es más barato que coordinarlos.
    needs: artifacts
    # macOS obligatorio: un .dmg se construye con `hdiutil`, que no existe en
    # Linux. Es también el único job que cuesta minutos de macOS runner.
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Mismo pin que ci.yml: Bun 1.4.x rompe @memoize (issue #80).
          bun-version: "1.1.30"

      - run: bun install --frozen-lockfile

      # electron-builder toma la versión del `package.json` de apps/desktop, no
      # del tag: sin esto el .dmg de v1.4.0 se llamaría "IA Flow-1.0.0.dmg" y
      # la app reportaría una versión que no existe. Se inyecta acá en vez de
      # hacer que release-please mantenga en sync N package.json — el tag ya es
      # la fuente de verdad, y esto no puede desincronizarse.
      - name: Fijar la versión del tag
        run: |
          # `export`, y NO una var de `env:` acá abajo: el tag viene como
          # `v1.2.3` y package.json necesita `1.2.3`. Declarar VERSION en
          # `env:` la haría llegar CON la `v` y pisaría a la despojada.
          export VERSION="${TAG#v}"
          echo "Empaquetando como $VERSION"
          bun -e '
            const p = "apps/desktop/package.json"
            const d = await Bun.file(p).json()
            d.version = process.env.VERSION
            await Bun.write(p, JSON.stringify(d, null, 2) + "\n")
          '
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      # Construye el main, la SPA y el .dmg (arm64 + x64). Sin firmar: no hay
      # Developer ID en este proyecto — ver `identity: null` en
      # electron-builder.yml y la nota de Gatekeeper en las notas de la release.
      - name: Empaquetar
        run: bun run --cwd apps/desktop dist

      - name: Adjuntar a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/desktop/*.dmg
          # No pisa las notas que escribió release-please.
          append_body: true
          body: |

            ### App de escritorio

            El `.dmg` de abajo no está firmado (este proyecto no tiene
            Developer ID), así que Gatekeeper la bloquea la primera vez.
            Después de arrastrarla a Applications:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/IA Flow.app"
            ```

            La app no trae server: se conecta al que elijas en su pantalla de
            servers. Para levantar uno, usá el bundle `ia-flow-server.js` de
            esta misma release — su `.tar.gz` trae un `Dockerfile.example`
            listo para copiar.
