# Fuente estática para `repoRepo` en modo IA_FLOW_REPOS_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlRepoRepository.ts).
#
# `path` sigue siendo OBLIGATORIO acá aunque este roster no lea el repo
# localmente (el agente no tiene fs_read/fs_list/fs_grep, solo el MCP de
# GitHub — ver agents.refiner.github-issues.yaml). Es plomería interna del
# engine, no algo que el agente use: `AgentOrchestrator` (packages/agent-
# engine/src/AgentOrchestrator.ts) intenta clonar el repo y persistir el
# path la primera vez que ve un repo SIN `path` pero con
# `githubOwner`/`githubRepo` — eso pasa SIEMPRE que faltan esos 3 juntos,
# sin mirar qué tools declara el agente. En modo YAML ese `repoRepo.upsert()`
# tira (read-only) en vez de persistir, así que si `path` queda vacío acá el
# primer dispatch rompe. Declarar `path` de antemano evita que ese branch
# se dispare — cloná el repo vos mismo dentro del volumen `/data` (o
# montalo) apuntando `path` ahí, aunque nada lo vaya a leer en runtime.
#
# `name` tiene que matchear el `repo` de source.config en projects.yaml
# (github-issues está atado a un solo repo). `projectId` tiene que matchear
# el `id` de projects.yaml. `workflow: main` porque no hace falta un
# worktree por task (sin fs_write/bash, el agente no escribe en el repo —
# la escritura del PRD va por `update_issue_body`, que pega directo a la API
# de GitHub, y el resto de lectura va por el MCP de GitHub, no por disco).
- name: ia-flow
  projectId: ia-flow
  path: /data/repos/ia-flow
  githubOwner: julianjab
  githubRepo: ia-flow
  workflow: main
