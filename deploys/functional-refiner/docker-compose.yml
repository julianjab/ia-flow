# ia-flow — sólo el agente de refinación, en modo polling (sin túnel), contra
# github.com/julianjab/ia-flow.
#
# Corre la imagen `containers/runner/` (flavor `runner` de apps/server). Toda
# la config del roster vive en ./runner.yaml; este archivo sólo dice qué
# imagen, qué puerto y qué secretos.
#
# El server PRINCIPAL sigue corriendo en el host (`bun run dev:server`), no
# acá — ese es el flujo de dev normal del repo.
#
# Uso (desde esta carpeta):
#   cp refiner.env.example .env   # completar valores reales
#   podman compose up -d --build  # o: docker compose up -d --build

services:
  refiner:
    build:
      context: ../..
      dockerfile: containers/runner/Dockerfile
    container_name: ia-flow-refiner
    ports:
      # Modo polling: nada tiene que entrar de afuera. Se publica sólo para
      # debug directo (/health, /api/webhooks/status), y a un puerto de host
      # distinto del 3001 que ocupa el server principal.
      - "127.0.0.1:3002:3001"
    volumes:
      - ia-flow-refiner-state:/state
      - ./runner.yaml:/app/config/runner.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?falta ANTHROPIC_API_KEY en .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?falta GITHUB_TOKEN en .env}
    restart: unless-stopped

volumes:
  ia-flow-refiner-state:
