# ia-flow — sólo el agente implementador contra github.com/julianjab/accountant.
#
# Corre la imagen `containers/runner/` (flavor `runner` de apps/server). Toda
# la config del roster vive en ./runner.yaml.
#
# Uso (desde esta carpeta):
#   cp implementer.env.example .env   # completar valores reales
#   podman compose up -d --build      # o: docker compose up -d --build
#
# Modo webhook: este contenedor NUNCA abre ni administra un túnel. Corré uno
# en el host apuntando al puerto publicado abajo, y pegá
# <url-del-túnel>/api/webhooks/github en el webhook del repo:
#   cloudflared tunnel --url http://localhost:8787

services:
  implementer:
    build:
      context: ../..
      dockerfile: containers/runner/Dockerfile
    container_name: ia-flow-implementer-accountant
    ports:
      # Un solo puerto: el flavor runner ya no necesita el proxy separado que
      # existía para esconder la API completa — no tiene una que esconder.
      # 8787 en el host por continuidad con el túnel que ya tenías configurado.
      - "127.0.0.1:8787:3001"
    volumes:
      - ia-flow-implementer-state:/state
      - ./runner.yaml:/app/config/runner.yaml:ro
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?falta CLAUDE_CODE_OAUTH_TOKEN en .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?falta GITHUB_TOKEN en .env}
      # Opcional: sin esto, runner/webhook-secret.ts genera uno al primer boot
      # y lo persiste en /state/webhook-secret.
      IA_FLOW_WEBHOOK_SECRET: ${IA_FLOW_WEBHOOK_SECRET:-}
    restart: unless-stopped

volumes:
  ia-flow-implementer-state:
