# Fuente estática para `mcpCatalogRepo` en modo IA_FLOW_MCP_CATALOG_REPO=yaml
# (ver apps/server/src/infrastructure/db/yaml/YamlMcpCatalogRepository.ts).
#
# Idéntico al entry de agents/functional-refiner/ — mismo MCP oficial remoto
# de GitHub, mismo id (`github-mcp`). El implementer lo usa para escribir
# código de verdad (crear branch, push de archivos, abrir PR) en vez de un
# checkout local — ver agents.implementer.yaml, sección "Cómo implementa".
#
# `${GITHUB_TOKEN}` se interpola en runtime con Bun.env.GITHUB_TOKEN (ver
# Agent.interpolateMcpServers) — el mismo token que ya usa el source
# github-issues para leer/escribir issues, no hace falta un token aparte.
- id: github-mcp
  name: GitHub MCP
  description: >-
    MCP remoto oficial de GitHub (https). Usa el env var GITHUB_TOKEN ya
    configurado en este deploy.
  config:
    type: http
    url: https://api.githubcopilot.com/mcp/
    authorizationToken: ${GITHUB_TOKEN}
