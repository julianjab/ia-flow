# Fuente estática para `projectRepo` en modo IA_FLOW_PROJECT_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlProjectRepository.ts).
#
# `id` tiene que matchear el `projectId` usado en repos.yaml.
#
# SIN `anchorLabel` a propósito: julianjab/accountant es un repo dedicado a
# este pipeline, así que no hay issues humanos que convenga dejar fuera y
# mantener una label ancla al día sería puro bookkeeping. El source
# `github-issues` acepta omitirla (ver GitHubIssueSourceConfig.anchorLabel):
# TODO issue abierto del repo pasa a ser candidato.
#
# Lo que evita que eso dispare el agente sobre cualquier issue es el filtro
# de activación, no el ancla: `accountant-implementer` pide `statusName:
# build` + `when: status = build` (agents.implementer.yaml), o sea sólo
# issues con la label `status:build`. Un issue sin `status:*` entra al scan
# y no matchea ningún agente — se descarta ahí.
#
# Si algún día el repo pasa a tener issues ajenos al engine, volvé a poner
# `anchorLabel: <label>` acá: es la única forma de excluir un issue del scan
# de entrada. `getHealth()` reporta un warning mientras no esté.
#
# Statuses, catálogo MCP, system prompts, settings y prompts NO tienen su
# propio archivo acá salvo mcp-catalog.yaml (este roster SÍ lo usa — el
# implementer escribe código vía el MCP de GitHub, no vía fs_write/bash).
# Los otros 4 quedan en SQLite por default sin que nadie los toque.
#
# `settings` es un bag abierto (`daemonMode` ya vive ahí — ver
# packages/issue-sources/src/dispatch/daemon-mode.ts). También soporta un
# filtro general de proyecto, previo a cualquier agente: si un item no lo
# pasa, ni siquiera se despacha (ver
# packages/issue-sources/src/dispatch/project-filter.ts). No movemos acá el
# `when: [{field: status, op: '=', value: build}]` que ya tiene el agente
# (agents.implementer.yaml) porque este roster tiene un solo agente — no hay
# nada que deduplicar todavía. Ejemplo si en el futuro suman un segundo
# agente al mismo proyecto:
#
#   settings:
#     statusName: build
#     when:
#       - field: status
#         op: "="
#         value: build
- id: accountant
  name: accountant
  language: español
  settings:
    # Redundante con IA_FLOW_DAEMON_MODE del docker-compose (que ya default-ea
    # a webhook), pero declarado acá el proyecto no depende del env del
    # deploy: project.settings.daemonMode gana sobre la env var
    # (packages/issue-sources/src/dispatch/daemon-mode.ts).
    daemonMode: webhook
  source:
    kind: github-issues
    config:
      owner: julianjab
      repo: accountant
