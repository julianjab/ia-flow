# Fuente estática para `projectRepo` en modo IA_FLOW_PROJECT_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlProjectRepository.ts).
#
# `id` tiene que matchear el `projectId` usado en repos.yaml.
#
# Statuses, system prompts reusables (SystemPromptDef) y prompts NO tienen
# su propio archivo acá: la sección `mcp` vive en runner.yaml (todos los
# agentes del roster la usan — leen y escriben los repos vía el MCP de
# GitHub) y el resto queda en SQLite por default, sin que nadie lo toque.
#
# `settings.systemPrompts` — array de SystemPromptRef (id string | {text})
# que se manda como system prompt de Anthropic a TODOS los agentes de este
# proyecto automáticamente, sin que cada uno tenga que declarar nada (ver
# ProjectSettingsSchema.systemPrompts en packages/shared/src/schemas.ts y
# resolveSystemPromptBlocks en packages/agent-engine/src/system-prompt-blocks.ts).
# Acá va un solo entry inline (`{text}`) con las reglas transversales al
# pipeline; si algún agente puntual necesita algo propio ADEMÁS de esto, se
# lo agrega a su propio `systemPrompts: [...]` en su archivo de agents/
# (puede mezclar ids de system-prompts.yaml con más `{text}` inline, en el
# orden que declare) — hoy ninguno lo necesita: el default del proyecto
# alcanza para los 4.
name: subscriptions-ai-flow
language: español
settings:
  # Estaba como `*pipelinePrompts`, alias del bloque que definía el proyecto
  # `subscriptions` (fuente github-issues) que se borró de este archivo. Un
  # alias YAML no sobrevive a que se vaya su anchor: el runner moría al
  # bootear con "Unresolved alias (the anchor must be set before the alias)".
  # Con un solo proyecto no hay nada que compartir, así que va inline.
  systemPrompts:
    - text: You are Claude Code, Anthropic's official CLI for Claude.
    - text: |
        Formás parte de un pipeline automatizado de ia-flow para repos de
        la-haus (functional-refiner → refiner → implementer → reviewer).
        Leés y escribís los repos con las tools que tengas en la sesión: el
        MCP oficial de GitHub siempre está; filesystem y shell dependen del
        provider que te ejecuta.

        Reglas transversales, válidas sin importar qué paso del pipeline
        seas:

        - Respondé siempre en español.
        - Antes de trabajar sobre un repo, leé su `CLAUDE.md`, `AGENTS.md`
          y `README.md` de la raíz (y el del directorio que toques, si
          existe): sus convenciones de arquitectura, estilo, testing y
          proceso GANAN sobre cualquier heurística del prompt de tu paso.
          Si el repo trae subagentes propios en `.claude/agents/` y tu
          sesión tiene la Task tool, delegá el trabajo en ellos — conocen
          el repo mejor que vos.
        - Nunca mergees un Pull Request, ni sugieras que se mergee — eso
          lo decide siempre un humano.
        - No toques ni leas repos fuera de los de la tarea: los que vienen
          en el prompt de tu paso (task.repos), más los que ese mismo
          prompt te habilite explícitamente (el refinador funcional explora
          su tabla de repos; los demás pasos trabajan sólo su repo).
        - Ante ambigüedad real o un bloqueo que no te corresponde
          resolver, preferí fallar explícito (`fail_task` con el detalle)
          antes que improvisar una decisión de producto o arquitectura.
        - Sé conservador: un cambio chico y verificable es mejor que uno
          grande que no podés confirmar vos mismo. Verificá con lo que
          tengas a mano, y decí explícitamente qué quedó sin verificar.
  slackReviewChannel: C0AGHAKPG6T
  slackReviewers:
    - id: U0AGVLRV6A2
      name: vitruvio
      isBot: true
source:
  kind: github
  config:
    url: https://github.com/orgs/la-haus/projects/119
    # `workingMarker` — cómo se marca EN EL BOARD que un agente ya tomó un
    # item. Es el único guard anti-doble-dispatch que sobrevive al proceso:
    # el resto (`dispatching`, pending tasks, el lock por task) vive en la
    # RAM de este daemon, así que sin marca dos runners contra el board 119
    # despachan el mismo issue y un reinicio re-despacha runs todavía vivos.
    #
    # Sin declararlo vale el default histórico (`Working` = `Yes`, "libre" =
    # campo vacío), que es lo que corre hoy. Si el board no tiene esa
    # columna, el proyecto NO se frena: `getHealth` lo reporta como warning
    # (antes era `missing`, y eso pausaba el dispatch del proyecto entero).
    #
    workingMarker:
      field: Working          # una columna del board, o `Labels`
      on: 'Yes'               # en Labels: '+ia-flow:working'
      off: ''                 # en Labels: '-ia-flow:working' (obligatorio)
  
    # `workingMarker: null` apaga la marca del todo — aceptable sólo con un
    # runner único y providers sync, donde el run muere con el proceso.
    # `field: Status` está prohibido: `applyTransition` ya escribe esa
    # columna en cada outcome y los dos se pisarían.
