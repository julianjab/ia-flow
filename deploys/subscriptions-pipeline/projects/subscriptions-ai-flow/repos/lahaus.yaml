# Roster multi-repo del pipeline — los repos de la-haus que el
# functional-refiner puede tocar al desglosar una épica, y donde el
# implementer puede aterrizar un sub-issue técnico. Mismas reglas que
# subscriptions.yaml (leé su encabezado): `path` es el clone dentro del
# contenedor bajo /state/repos (reposBase del provisioner), las coordenadas
# githubOwner/githubRepo son lo que usa un gateway remoto para clonar en SU
# disco, y el `projectId` sale del nombre de la carpeta — no se declara acá.
#
# Sin `slackReviewChannel`/`slackReviewers`: se heredan campo por campo de
# `settings` del proyecto (resolveSlackReviewTarget en @ia-flow/shared).
#
# Un sub-issue creado por el functional-refiner EN uno de estos repos llega
# al engine con `task.repos = [<repo>]` vía el campo Repository nativo del
# board — no hace falta setear el campo custom `Repos`.
#
# Agregar un repo nuevo al pipeline = una entrada acá, y nada más: el
# prompt del functional-refiner lo descubre vía `{{project.repos}}`, que
# renderiza `- <name> — <description>` por repo — por eso `description` no
# es decorativa: es lo que el descomponedor lee para decidir dónde aterriza
# cada sub-issue (poné qué es, stack y cómo se valida).

- name: ai-mobile-app
  description: >-
    App móvil de LaHaus (Flutter/Dart). Validación: flutter analyze +
    flutter test; trae Makefile propio.
  path: /state/repos/la-haus/ai-mobile-app
  githubOwner: la-haus
  githubRepo: ai-mobile-app
  workflow: worktree

- name: ims-backend
  description: >-
    IMS — backend de inventario/propiedades (Ruby on Rails). Validación:
    rubocop + rspec; trae docker-compose propio con Postgres aislado.
  path: /state/repos/la-haus/ims-backend
  githubOwner: la-haus
  githubRepo: ims-backend
  workflow: worktree

- name: lh-seller-v2-frontend
  description: >-
    Frontend web de sellers (JS/TS, yarn). Validación: los scripts de
    package.json (lint/test/typecheck — verificar cuáles existen).
  path: /state/repos/la-haus/lh-seller-v2-frontend
  githubOwner: la-haus
  githubRepo: lh-seller-v2-frontend
  workflow: worktree

- name: ai-cognitive-platform
  description: >-
    Plataforma cognitiva de AI (Python, uv). Validación: ruff + pytest.
  path: /state/repos/la-haus/ai-cognitive-platform
  githubOwner: la-haus
  githubRepo: ai-cognitive-platform
  workflow: worktree

# ── Infra ────────────────────────────────────────────────────────────────
# En estos dos la validación local se queda en lo que no toca cluster ni
# estado remoto (kustomize build, yamllint, terraform fmt/validate);
# kubectl, terragrunt plan/apply y todo lo que necesite credenciales AWS lo
# corre un humano o el CI del repo.

- name: eks
  description: >-
    Manifiestos Kubernetes (EKS) de toda la plataforma — deployments,
    services y operaciones por ambiente (prod/stg/ss), GitOps con Flux +
    Kustomize. Secretos con SOPS. Validación local: kustomize build +
    yamllint; kubectl y todo lo que toque cluster lo corre un humano/CI.
  path: /state/repos/la-haus/eks
  githubOwner: la-haus
  githubRepo: eks
  workflow: worktree

- name: platform-infrastructure
  description: >-
    Infraestructura de plataforma — IaC con Terraform/Terragrunt, imágenes
    Docker golden, scripts de automatización y CLI Go (lahaus) multi-ambiente
    AWS. Validación local: terraform fmt + terraform validate; terragrunt
    plan/apply necesitan credenciales y los corre un humano/CI.
  path: /state/repos/la-haus/platform-infrastructure
  githubOwner: la-haus
  githubRepo: platform-infrastructure
  workflow: worktree

# ── Agentes AI ───────────────────────────────────────────────────────────

- name: ai-cx-agents
  description: >-
    Monorepo de agentes AI transaccionales de customer experience — runtime
    ZeroClaw (Rust), memoria Postgres schema-per-enterprise, API-only.
    Mayormente definiciones de agentes, configs, scripts y docs.
  path: /state/repos/la-haus/ai-cx-agents
  githubOwner: la-haus
  githubRepo: ai-cx-agents
  workflow: worktree

- name: claw-agents
  description: >-
    Sistema multi-agente de LaHaus — agentes en pods de K8s que se comunican
    por Slack e implementan cambios vía Claude Code (runtimes OpenClaw y
    Claude Code nativo). Node.js; validación según los scripts del repo.
  path: /state/repos/la-haus/claw-agents
  githubOwner: la-haus
  githubRepo: claw-agents
  workflow: worktree

# El clone local se llama crm-claude-agents-v2, pero el repo de GitHub es
# crm-claude-agents — acá va el nombre del remote, que es lo que resuelven
# las coordenadas y el campo Repository del board.
- name: crm-claude-agents
  description: >-
    Definiciones de agentes Claude para análisis de CRM (HubSpot, funnels
    comerciales) — configs, plantillas, validadores y docs, sin código de
    aplicación tradicional.
  path: /state/repos/la-haus/crm-claude-agents
  githubOwner: la-haus
  githubRepo: crm-claude-agents
  workflow: worktree
