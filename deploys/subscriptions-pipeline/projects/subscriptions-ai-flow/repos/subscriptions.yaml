# Fuente estática para `repoRepo` en modo IA_FLOW_REPOS_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlRepoRepository.ts).
#
# `path` es el clone DENTRO del contenedor del runner. Un provider en OTRA
# máquina (el gateway de la mac) lo ignora si no existe en su disco y clona
# por las coordenadas `githubOwner`/`githubRepo` bajo su GATEWAY_REPOS_BASE
# (ver resolvePrimaryPath en packages/workspace/src/provisioners.ts).
# Declararlo también evita el `repoRepo.upsert()` que en modo YAML tira
# (read-only) cuando el engine intenta persistir un path que descubrió.
#
# `name` tiene que matchear el `repo` de source.config del proyecto.
# El `projectId` sale del nombre de la carpeta — no se declara acá.
#
# `workflow: worktree` — el implementer escribe localmente cuando el run
# aterriza en una máquina con filesystem (bash_run/fs_write): el provisioner
# materializa el worktree de la task, parado en `{{task.branch}}`, y el git
# context del prompt describe esa branch (con `main`, la sesión quedaba en
# main y el git context decía "commit directly on main" contradiciendo al
# prompt, que exige comitear en la branch de la task).
- name: subscriptions
  path: /data/repos/subscriptions
  githubOwner: la-haus
  githubRepo: subscriptions
  workflow: worktree

# Mismo clone, para el proyecto alimentado por el board 119. El índice de
# YamlRepoRepository es `(name, projectId)` (ver getByProject), así que
# repetir `name: subscriptions` con otro projectId no colisiona — y hace
# falta, porque sin una entrada para ese projectId el engine no sabe dónde
# vive el repo y `upsert` tira por ser read-only.
