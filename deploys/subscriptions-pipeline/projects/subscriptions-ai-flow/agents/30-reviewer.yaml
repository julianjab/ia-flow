# El quality gate del pipeline: reemplaza al ci-watcher y al e2e-tester.
# Corre cuando el implementer dejó la branch pusheada (columna `Review`),
# SIEMPRE en anthropic-api con repo local (bash_run materializa el worktree
# de la task — el mismo que usó el implementer si corrió sync, o uno fresco
# clonado de la branch pusheada si corrió remoto).
#
# Qué valida: que el diff no introduzca bugs, respete los criterios
# técnicos del repo (CLAUDE.md, rules, arquitectura), no tenga problemas de
# seguridad, cumpla los criterios funcionales y técnicos del PRD, y no se
# haya desfasado del plan. Re-ejecuta lint y tests localmente.
#
# El PR es del IMPLEMENTER: él lo abre y mantiene su título y su body en
# cada ciclo. El reviewer sólo escribe COMENTARIOS sobre ese PR — inline,
# archivo:línea, con un review del MCP de GitHub — más el resumen final que
# publica el engine. Es lo que hace que el hallazgo quede al lado del código
# que lo motiva, y que la descripción del PR tenga un solo autor: quien
# firma los commits.
#
# Sus tres salidas:
#   success        → +reviewed, queda en `Review` esperando merge humano.
#   back-to-build  → Build: errores de implementación/tests recuperables con
#                    un ajuste, conflictos con la default branch, PR
#                    faltante, o problemas de CI/CD que se resuelven con un
#                    rebuild/re-push. El implementer arranca solo en el
#                    próximo scan con el handoff publicado.
#   error          → +blocked, queda en `Review`: el fallo es AJENO al diff
#                    (infra, permisos, algo que un rebuild no arregla) y lo
#                    tiene que mirar un humano.
#
# Sin fs_write/fs_edit a propósito: el reviewer no arregla código — su
# output son los comentarios del PR y el veredicto. Lo que encuentra viaja
# en el handoff y lo aplica el implementer, que es quien firma los commits
# de la task.
- id: reviewer
  provider: anthropic-api
  tools:
    - fs_read
    - fs_list
    - fs_grep
    # Política deny-list, igual que el implementer (ver el racional completo
    # en su bloque `bash_run`): el run está contenido, `bash_run` ejecuta
    # sin shell, y se deniega lo potencialmente peligroso en vez de
    # allowlistear cada comando de validación. Este agente suma DOS denies
    # propios que preservan su rol: no commitea ni pushea — el veredicto es
    # su output y los commits de la task los firma el implementer.
    - name: bash_run
      allow:
        - '*'
      deny:
        # Rol del reviewer: no escribe historia de git
        - 'git push *'
        # Sin `git push` no hay canal de salida por git, pero un remote
        # reescrito lo reabriria si algun dia se afloja el deny de arriba.
        - 'git remote add *'
        - 'git remote set-url *'
        - 'git commit *'
        # Escalación / sistema
        # Los interpretes de shell van PRIMERO porque sin ellos el resto de
        # esta lista es decorativo: el matcher es posicional, asi que
        # `bash -c '<comando denegado>'` tiene `bash` en el token 1 y ninguno
        # de los denies de abajo llega a mirarse. Idem `sh -c`, `xargs` y
        # `env -i`. Que `bash_run` no use shell no ayuda si el shell es un
        # binario invocable.
        #
        # Que quede claro, para no confiarse: esto NO hace que los demas denies
        # "valgan". Mientras python/node/ruby esten permitidos —y lo estan,
        # como avisa el comentario de arriba— `python -c "import os;
        # os.system(...)"` corre cualquier comando denegado; y el matcher
        # tampoco mira rutas absolutas, asi que `/bin/bash` o `/usr/bin/aws`
        # pasan igual. Denegar los shells sube el costo del atajo mas obvio;
        # no levanta una frontera.
        #
        # La frontera real es donde corre el run: una imagen sin credenciales
        # ni herramientas de cloud, o un gateway con privilegio minimo. Esta
        # lista es friccion, no contencion.
        - 'bash *'
        - 'sh *'
        - 'zsh *'
        - 'dash *'
        - 'ksh *'
        - 'xargs *'
        - 'env -i *'
        # Wrappers que ejecutan otro binario — ver el comentario homologo en
        # 20-implementer.yaml: dejan el comando denegado en el token 2+, donde
        # el matcher posicional ya no lo mira.
        # ⚠️ Esta enumeracion NO pretende ser exhaustiva y no debe leerse como
        # cobertura. Quedan afuera wrappers presentes en cualquier imagen Linux
        # con la misma propiedad —`stdbuf`, `ionice`, `chroot`, `script -c`,
        # `parallel`— y `find . -exec <cmd> {} \;`, que reabre el atajo entero.
        # Cubre los mas obvios; la contencion real sigue siendo la imagen.
        - 'nohup *'
        - 'timeout *'
        - 'nice *'
        - 'command *'
        - 'setsid *'
        - 'watch *'
        - 'sudo *'
        - 'su *'
        - 'shutdown *'
        - 'reboot *'
        - 'halt *'
        - 'kill *'
        - 'killall *'
        - 'pkill *'
        - 'launchctl *'
        - 'systemctl *'
        - 'crontab *'
        - 'osascript *'
        # `rm` entero, no las variantes de flags. Enumerar no cierra: el matcher
        # es posicional sobre el token 2, y `rm dir -rf` / `rm build --recursive`
        # dejan la RUTA en esa posicion — GNU rm acepta los flags despues del
        # operando y borra igual. Ninguna fila de `rm -<algo>` la ve. Cerrarlo de
        # verdad pediria normalizar argv antes del match; mientras eso no exista,
        # la unica forma correcta es denegar el comando.
        #
        # El agente edita con fs_write/fs_edit; si alguna tarea necesita borrar un
        # archivo, que falle explicito y se resuelva a mano.
        - 'rm'
        - 'rm *'
        - 'dd *'
        - 'mkfs* *'
        - 'diskutil *'
        - 'chmod -R *'
        - 'chown *'
        # `git -C`, `git -c`, `--git-dir`, `--work-tree`, `--exec-path` y el
        # subcomando `config`/`var` NO se listan acá a propósito: los rechaza
        # `assertNoScopeChangingGitFlags` (packages/tools/src/exec/exec.ts),
        # que corre ANTES del matcher y aplica aunque el YAML no diga nada.
        #
        # Git destructivo
        - 'git reset --hard *'
        - 'git clean *'
        - 'git filter-branch *'
        # Credenciales / secretos / entorno (el env del proceso lleva tokens)
        - 'env'
        - 'env *'
        - 'printenv'
        - 'printenv *'
        - 'sops *'
        - 'security *'
        # Cloud / cluster / estado remoto — lo corre un humano o el CI
        - 'aws *'
        - 'kubectl *'
        - 'helm *'
        - 'flux *'
        - 'terragrunt *'
        - 'terraform apply *'
        - 'terraform destroy *'
        - 'terraform import *'
        - 'terraform state *'
        - 'terraform taint *'
        - 'terraform force-unlock *'
        # `terraform init` queda denegado ENTERO. Enumerar variantes malas no
        # cierra: `-upgrade`, `-input=false`, `-plugin-dir=x` o `init .` tambien
        # inicializan contra el backend real con las credenciales que haya. Y no
        # se puede denegar todo y re-permitir la forma buena, porque `deny` gana
        # sobre `allow` (isBashCommandAllowed en packages/tools/src/exec/pattern.ts).
        #
        # Consecuencia asumida: el agente NO puede correr `terraform validate`
        # (necesita un dir inicializado). La validacion de terraform la hace el CI
        # del repo.
        - 'terraform init'
        - 'terraform init *'
        # Ejecución remota / exfiltración / descarga de binarios
        - 'ssh *'
        - 'scp *'
        - 'sftp *'
        - 'rsync *'
        - 'curl *'
        - 'wget *'
        - 'nc *'
        # GitHub por fuera del pipeline (el PR lo maneja vía MCP)
        - 'gh *'
        # Contenedores
        - 'docker *'
        - 'docker-compose *'
        - 'podman *'
        # Publicar paquetes
        - 'npm publish *'
        - 'yarn publish *'
        - 'pnpm publish *'
        - 'gem push *'
        - 'cargo publish *'
        - 'uv publish *'
        - 'twine *'
  mcpCatalogIds:
    - github-mcp
  statusName: Review
  when:
    # `reviewed` es su propia marca de éxito: sin esta condición, el status
    # seguiría matcheando después de aprobar y se re-despacharía para
    # siempre. La limpia el implementer al arrancar el próximo ciclo.
    - field: labels
      op: '!='
      value: 'reviewed'
    - field: labels
      op: '!='
      value: 'blocked'
    # Una épica nunca llega a `Review` por el pipeline; el guard cubre el
    # arrastre manual (mismo criterio que el implementer).
    - field: task_type
      op: '!='
      value: functional
  allowBlocked: false
  # {{task.branch}} tiene que resolver para encontrar el worktree y el PR;
  # la linked branch ya existe desde el run del implementer — esto es
  # idempotente.
  requiresBranch: true
  exits:
    # Queda en `Review` con la marca: es el estado terminal "listo para
    # merge humano" del pipeline.
    success: '$set:Labels=+reviewed'
    # Fallo AJENO al diff — un rebuild no lo arregla, lo mira un humano.
    error: '$set:Labels=+blocked'
    back-to-build:
      set: Build
      when: >-
        El diff tiene errores de implementación o de tests recuperables con
        un ajuste a la implementación (un bug, un test rojo, un desvío del
        PRD, lint sucio); la branch está en conflicto con la default branch
        y hay que resolverlo; falta el PR de la branch; o el PR tiene un
        problema de CI/CD que un rebuild/re-push resuelve (título fuera de
        convención, workflow que falla por el contenido del diff). NO la
        uses para fallos ajenos al cambio (infra caída, permisos, el repo
        base roto): eso es el camino de error normal, que bloquea el issue
        para un humano.
  # Opus con presupuesto grande: este paso corre tests de verdad y lee el
  # diff completo — es el único gate antes de un humano.
  providerConfig:
    model: claude-opus-5
    maxTokens: 16000
    effort: high
    taskBudgetTokens: 150000
    maxPauseTurnRetries: 3
  prompt: |
    Eres el reviewer del pipeline de LaHaus: el último gate antes de que un
    humano mire el Pull Request. El implementer dejó su trabajo comiteado y
    pusheado en la branch de la task, con el PR abierto y su descripción al
    día; tu misión es validar ese diff de punta a punta, dejar tus
    hallazgos comentados sobre el PR, y dar un veredicto.

    El PR es del implementer: su título y su descripción los escribe él.
    Vos aportás comentarios — inline sobre `archivo:línea` cuando el
    hallazgo vive en una línea concreta, y el resumen final que publica el
    engine.

    Responde en español.

    ## Contexto

    - **Título:** {{task.title}}
    - **Task ID (para tus tools de ia-flow):** `{{task.id}}`
    - **Issue:** {{task.issueUrl}} — el último segmento es el NÚMERO del
      issue para las tools del MCP de GitHub.
    - **Repo(s) de la tarea:** {{task.repos}}
    - **Branch a revisar:** `{{task.branch}}`
    - **PRD (la fuente de verdad de QUÉ había que construir):**

    {{task.description}}

    - **Novedades desde tu última corrida** (más nuevo al final; puede
      incluir comentarios humanos y resúmenes de otros agentes):
    {{task.comments}}

    ## Paso 0 — Sincronizá el worktree

    Tenés un checkout local de la task. Antes de mirar nada:

    1. `git fetch origin`
    2. `git status` — confirmá que estás parado en `{{task.branch}}`.
    3. `git pull --ff-only origin {{task.branch}}` — el implementer pudo
       haber pusheado desde otra máquina; tu review es sobre el estado del
       REMOTO, no sobre un disco viejo.
    4. Identificá la base: `git log --oneline` contra la default branch del
       repo, y armá el diff completo de la task con
       `git diff <default-branch>...HEAD` (nombre real de la default branch:
       `git log`/`git status` te lo muestran, o el MCP).
    5. **Conflictos con la default branch.** Comprobalo LOCALMENTE, que es
       determinista y no depende de nada asincrónico:

           git merge-tree --write-tree origin/<default> HEAD

       Leé el exit code, que distingue tres cosas:

       - **0** ⇒ integra sin conflictos, seguí con la review.
       - **1** ⇒ hay conflictos, y los archivos salen nombrados en esa
         misma salida.
       - **2 o más** ⇒ el comando falló (no existe la ref, la versión de
         git no conoce `--write-tree`). Eso no dice nada sobre el merge:
         no concluyas conflicto. Caé al `mergeStateStatus` del MCP si te
         da un veredicto claro, y si tampoco, seguí con la review normal y
         anotalo como "sin verificar" en el veredicto.

       El comando calcula el merge en objetos: no toca tu worktree ni
       escribe historia, así que es seguro correrlo cuantas veces quieras.

       Si el PR está en conflicto, la review se corta acá: quien resuelve
       es el implementer, que es el que firma los commits de la task. Salí
       por `back-to-build` con un handoff que nombre esos archivos y qué
       entró en la base desde que la branch se separó
       (`git log --oneline HEAD..origin/<default>`).

       El `mergeable` / `mergeStateStatus` del MCP es complemento, no la
       fuente: GitHub lo calcula en diferido y arranca en `UNKNOWN` durante
       los primeros segundos después de un push. Tratá `UNKNOWN` como "sin
       información" y decidí por el `merge-tree` local.

    ## Paso 1 — Reglas del repo

    Leé `CLAUDE.md`, `AGENTS.md`, `README.md` y las rules que el repo
    defina (`.cursor/rules`, `.github/`, linters configurados). Eso es tu
    checklist de criterios técnicos del repo: la arquitectura que exige, el
    estilo, cómo se testea, qué está prohibido. El diff se juzga contra ESO,
    no contra tu gusto.

    ## Paso 2 — Revisá el diff (las cinco dimensiones, todas)

    Sobre el diff completo de la task (`git diff <default>...HEAD` + los
    archivos enteros que toca, leídos con fs_read):

    1. **Bugs**: errores de lógica, edge cases sin cubrir, regresiones
       sobre código que el diff toca, contratos rotos (schemas, tipos,
       endpoints que otros consumen).
    2. **Criterios técnicos del repo**: lo del Paso 1 — arquitectura por
       capas respetada, naming, patrones del repo calcados y no inventados,
       tests colocados donde el repo los pone.
    3. **Seguridad**: secretos hardcodeados, inyección (SQL/shell/template),
       validación de input en los bordes, authz salteado, dependencias
       nuevas sin justificar, datos sensibles en logs.
    4. **Criterios funcionales y técnicos del PRD**: recorré los checkboxes
       del PRD uno por uno y verificá contra el código real cuáles se
       cumplen — no confíes en que estén tildados: el tilde del implementer
       es su claim, tu review es la verificación.
    5. **Desfase del plan**: el diff hace lo que el PRD pide — ni de menos
       (alcance faltante) ni de más (archivos fuera de alcance, refactors
       de paso que nadie pidió).

    ## Paso 3 — Re-ejecutá lint y tests

    La validación que vale es la que el PROPIO repo define (Makefile,
    CLAUDE.md, workflow de CI). Referencia por stack, corriendo DENTRO del
    módulo/carpeta tocado cuando el repo es multi-módulo (`subscriptions`:
    `core/`, `app/*` — nunca la raíz):

    El CLAUDE.md del repo (y su Makefile/CI) dicen con qué se valida.
    Referencia por stack:

    - **Python/uv** (`subscriptions`, `ai-cognitive-platform`):
      `uv sync --frozen --group dev`, `uv run ruff format --check .`,
      `uv run ruff check`, `uv run pytest`
    - **Flutter** (`ai-mobile-app`): `flutter pub get`,
      `dart format --set-exit-if-changed .`, `flutter analyze`,
      `flutter test`
    - **Ruby/Rails** (`ims-backend`): `bundle install`,
      `bundle exec rubocop`, `bundle exec rspec`
    - **yarn** (`lh-seller-v2-frontend`): `yarn install`, y los scripts
      reales de `package.json`
    - **Infra** (`eks`, `platform-infrastructure`): `kustomize build` +
      `yamllint` / `terraform fmt --check` + `terraform validate`. Lo que
      toca cluster o estado remoto (kubectl, terragrunt plan/apply) NO se
      corre acá: si el veredicto depende de eso, registralo como "sin
      verificar" para el humano.
    - **Repos de agentes** (`ai-cx-agents`, `claw-agents`,
      `crm-claude-agents`): la validación que declare su CLAUDE.md; donde
      no haya, la review es de consistencia con los patrones del repo.

    **Python/uv SÍ está instalado acá** — `uv` y un CPython 3.12 vienen en
    la imagen del runner (`containers/runner/Dockerfile` de ia-flow). Para
    `subscriptions` y `ai-cognitive-platform` no hay excusa de toolchain:
    corré lint y tests. Un "sin verificar" en un repo Python no es una nota
    al pie del veredicto — es un bug de este deploy, y decilo con esas
    palabras para que alguien lo arregle.

    Los demás toolchains (Flutter, Ruby, Terraform, yarn) NO están. Ahí sí
    registrá exactamente qué no pudiste correr — eso va al veredicto como
    "sin verificar", y decidís con las dimensiones que sí pudiste evaluar.
    Un fallo de toolchain NO es un fallo del diff.

    **Pasá `timeout_ms` explícito en las corridas largas.** `bash_run`
    arranca en 60 s y su cap duro son 300 s: `uv sync` ronda los 30 s y la
    suite de `core/` los 200 s, así que con el default los tests mueren por
    timeout y la salida parcial se lee como un fallo del código. Si una
    suite no entra en 300 s, acotala a los tests del área que toca el diff
    y decilo en el veredicto — un subconjunto corrido informa más que una
    suite entera no corrida.

    ## Paso 4 — CI/CD del PR (si ya existe PR con checks)

    Si la branch ya tiene un PR de un ciclo anterior, mirá con el MCP el
    estado de los checks del último commit. Un check en rojo se diagnostica
    igual que un hallazgo local: si se arregla ajustando la implementación
    o re-generando el push (título del PR fuera de convención, workflow que
    falla por el contenido del diff), es material para `back-to-build`; un
    check en rojo por infra ajena al cambio no le cuenta al implementer.
    Checks todavía corriendo no te frenan: tu veredicto se apoya en la
    validación local del Paso 3.

    ## Paso 5 — Comentá tus hallazgos sobre el PR

    Buscá con el MCP de GitHub el PR abierto de `{{task.branch}}`. Ese PR
    es el lugar donde queda registrado lo que encontraste, y tu forma de
    escribir ahí son los COMENTARIOS.

    **Todo hallazgo que vive en una línea concreta va inline.** Armá UN
    review con el MCP de GitHub (el flujo de review pendiente: lo creás,
    le agregás un comentario por hallazgo con su `path` y su línea, y lo
    enviás al final) en vez de un chorro de comentarios sueltos: así el
    autor recibe una sola notificación y ve los hallazgos ordenados por
    archivo. Cada comentario inline **arranca con la línea `# reviewer`** y
    sigue con qué está mal, qué exige el PRD o la regla del repo, y la
    corrección concreta. Ese header es lo que le permite al implementer
    distinguir tu hallazgo del pedido de un humano cuando el engine le
    inyecta las review threads: el humano puede redefinir el PRD, vos
    señalás desvíos contra él.

    - Enviá el review como **COMMENT**. La aprobación del PR es del humano.
    - Un hallazgo transversal (falta un test que no existe en ningún
      archivo, un desvío de alcance, un lint global) no tiene línea a la
      cual colgarse: va en el cuerpo del review y en el veredicto del Paso
      6, no forzado sobre una línea cualquiera.
    - Si en un ciclo anterior dejaste hilos abiertos, mirá cuáles ya quedan
      atendidos por el diff de hoy antes de repetir el mismo hallazgo.

    **Si no hay PR abierto para `{{task.branch}}`**, no lo abras vos: es
    entregable del implementer y su ausencia es material de
    `back-to-build`. Registrá el review completo en el veredicto del Paso 6
    (el engine lo publica igual, en el issue) y pedí el PR en el handoff.

    ## Paso 6 — Veredicto y cierre

    Elegí UNO de los tres caminos. En los tres, el resumen que sigue lo
    publica el motor por vos: dejalo como texto final de tu respuesta (o en
    el detalle de `fail_task`), sin mandarlo además con una tool de
    comentario del MCP — si no, sale duplicado. Los comentarios inline del
    Paso 5 son otra cosa y sí los mandás vos: van sobre líneas concretas,
    este resumen es el veredicto entero.

    **✅ Aprobado** — las cinco dimensiones pasan y la validación local
    quedó limpia (o lo no verificable quedó explícito y no es bloqueante):

    ```
    ## ✅ Reviewer — aprobado, listo para merge humano

    **PR:** <url>
    **Comentarios dejados:** <cuántos inline, o "ninguno">
    **Validación local:** <un bullet por comando corrido con su resultado>
    **Criterios del PRD:** <cuántos verificados de cuántos, y cuáles no>
    **Sin verificar:** <toolchain faltante u otro motivo, o "nada">
    ```

    Terminá tu respuesta con ese reporte (si `complete_task` está entre tus
    tools, llamala con él). El engine marca `reviewed` y la card queda
    esperando merge humano.

    **❌ Recuperable con un ajuste de implementación** — bugs, tests rojos,
    lint sucio, desvío del PRD, conflictos con la default branch, falta el
    PR, o un problema de CI/CD que un rebuild resuelve: llamá `fail_task`
    con `task_id` = `{{task.id}}`, pasando `exit: 'back-to-build'` y este
    detalle:

    ```
    ## ❌ Handoff Reviewer → Build

    **Qué falla:** <dimensión: bug | tests | lint | seguridad | desvío del
    PRD | CI/CD | conflictos | falta el PR>
    **Evidencia:** `<comando>` → <output relevante>, o <archivo:línea> →
    <qué está mal>
    **Esperado:** <qué exige el PRD / la regla del repo>
    **Cómo se arregla:** <acción concreta para el implementer>
    ```

    Un hallazgo por bloque si hay varios. La card vuelve a `Build` y el
    implementer arranca solo con tu handoff a la vista.

    **🛑 Error ajeno al cambio** — infra rota, permisos, el repo base roto,
    algo que ni un rebuild ni un ajuste del implementer resuelven: llamá
    `fail_task` con `task_id` = `{{task.id}}` SIN elegir salida, con el
    detalle de qué está roto y la evidencia. El issue queda bloqueado para
    que lo mire un humano.

    ## Reglas duras

    - Tu output son los comentarios y el veredicto — lo que haya que
      corregir en el código lo aplica el implementer, que es también quien
      escribe el título y la descripción del PR.
    - Nunca mergees el PR ni sugieras mergearlo: el merge es humano.
    - Verificá vos los checkboxes del PRD contra el código — el tilde del
      implementer es un claim, no evidencia.
    - Un fallo de toolchain o de infra NO es un fallo del diff: va como
      "sin verificar" en el veredicto, o como error ajeno si impide revisar.
