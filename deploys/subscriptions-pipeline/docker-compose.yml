# ia-flow — pipeline de 4 agentes (functional-refiner → refiner →
# implementer → reviewer) contra los repos de la-haus y el board 119.
#
# Corre la imagen `containers/runner/` (flavor `runner` de apps/server): el
# engine headless, sin API que exponer. Toda la config del roster vive en
# ./runner.yaml — este archivo sólo dice qué imagen, qué puertos y qué
# secretos.
#
# El provider gateway (apps/ai-provider-gateway) NO corre acá: corre en tu
# HOST (`cd apps/ai-provider-gateway && bun run dev`, puerto 3002) y se
# self-registra contra este container como "julianbuitrago-mac". Lo usa
# `subscriptions-implementer` vía `provider: remote:*`.
#
# Conectividad host <-> container (Podman resuelve `host.containers.internal`
# de fábrica vía gvproxy; con Docker Desktop usá `host.docker.internal`):
#   - container -> host: seteá IA_FLOW_GATEWAY_PUBLIC_URL=http://host.containers.internal:3002
#     en apps/ai-provider-gateway/.env.
#   - host -> container: el gateway necesita POST /api/provider-registrations
#     de ESTE container, por eso publicamos su puerto. 3011 y no 3001: ese ya
#     lo usa tu server principal en el host. Seteá
#     IA_FLOW_REGISTER_SERVER_URLS=http://localhost:3011 en el .env del gateway.
#
# Uso (desde esta carpeta):
#   cp subscriptions.env.example .env   # completar CLAUDE_CODE_OAUTH_TOKEN y GITHUB_TOKEN
#   podman compose up -d --build        # o: docker compose up -d --build

services:
  subscriptions:
    build:
      context: ../..
      dockerfile: containers/runner/Dockerfile
    container_name: ia-flow-subscriptions-pipeline
    ports:
      # Un solo puerto ahora: el flavor runner expone el webhook, /health y el
      # self-registro de gateways, nada más — ya no hace falta el proxy
      # separado en 8787 que existía para esconder la API completa.
      #
      # SÓLO a 127.0.0.1: /api/provider-registrations muta estado y no tiene
      # auth propia. Para el webhook, corré un túnel en el host apuntando acá.
      - "127.0.0.1:3011:3001"
    volumes:
      # Con `settings.workspace: true` en runner.yaml este volumen ya no
      # guarda sólo el secret del webhook y el execution log: adentro viven
      # los clones (/state/repos/<owner>/<repo>) y los worktrees por task que
      # usa el implementer cuando corre por `anthropic-api`. Dimensionalo para
      # el repo, no para unos KB.
      - ia-flow-subscriptions-state:/state
      # El mount de un archivo no trae sus carpetas hermanas, así que sin la
      # segunda línea el runner arrancaría con cero agentes sin quejarse.
      # `projects/` trae todo: la definición de cada proyecto, sus agentes y
      # sus repos. Ver containers/runner/README.md.
      - ./runner.yaml:/app/config/runner.yaml:ro
      - ./projects:/app/config/projects:ro
    environment:
      # Los dos únicos secretos. buildAnthropicAuthHeader
      # (packages/ai-providers/src/anthropic-api/auth.ts) prioriza el token
      # OAuth sobre ANTHROPIC_API_KEY cuando ambos están seteados.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?falta CLAUDE_CODE_OAUTH_TOKEN en .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?falta GITHUB_TOKEN en .env}
      # Opcional: sin esto, runner/webhook-secret.ts
      # genera uno al primer boot y lo persiste en /state/webhook-secret.
      IA_FLOW_WEBHOOK_SECRET: ${IA_FLOW_WEBHOOK_SECRET:-}
    restart: unless-stopped

volumes:
  ia-flow-subscriptions-state:
