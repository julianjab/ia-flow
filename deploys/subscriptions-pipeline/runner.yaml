# ia-flow — config del deploy `subscriptions-pipeline`, archivo único del flavor `runner`.
#
# Reemplaza a los cuatro YAML sueltos (agents/projects/repos/mcp-catalog) y a
# ~10 env vars del compose. Los cuatro archivos existían porque son cuatro
# repositorios distintos del server, no porque alguien quisiera cuatro
# archivos; las env vars, porque no había dónde más ponerlas.
#
# La regla: **secreto → env; comportamiento → acá.** Por eso `${GITHUB_TOKEN}`
# se NOMBRA en la sección `mcp` pero nunca se escribe — este archivo se
# commitea.
#
# Se monta en /app/config/runner.yaml (ver docker-compose.yml al lado).

settings:
  daemonMode: webhook
  instanceId: subscriptions-pipeline
  logLevel: info

# projects/, repos/ y agents/ (al lado de este archivo) los carga el loader
# por convención — ver containers/runner/README.md.
#
mcp:
  # Fuente estática para `mcpCatalogRepo` en modo IA_FLOW_MCP_CATALOG_REPO=yaml
  # (ver apps/server/src/infrastructure/db/yaml/YamlMcpCatalogRepository.ts).
  #
  # Un solo entry: el MCP oficial remoto de GitHub. Los 3 agentes de este
  # roster (refiner, implementer, ci-watcher) lo referencian vía
  # `mcpCatalogIds: [github-mcp]` en agents.subscriptions.yaml — se expande y
  # mergea en providerConfig.mcpServers al momento del dispatch (ver
  # Agent.resolveMcpCatalog en packages/agent-engine/src/Agent.ts).
  #
  # `${GITHUB_TOKEN}` se interpola en runtime con Bun.env.GITHUB_TOKEN (ver
  # Agent.interpolateMcpServers) — el mismo token que ya usa el source
  # github-issues para leer/escribir issues y labels, no hace falta uno aparte.
  - id: github-mcp
    name: GitHub MCP
    description: >-
      MCP remoto oficial de GitHub (https). Usa el env var GITHUB_TOKEN ya
      configurado en este deploy.
    config:
      type: http
      url: https://api.githubcopilot.com/mcp/
      authorizationToken: ${GITHUB_TOKEN}
