# Columna `Refine` — se la reparten tres refinadores: `functional-refiner`
# por `Task Type`, y entre las técnicas, `frontend-refiner` vs `refiner` por
# `item.repos` (ver `refine-technical-frontend` más abajo — es el único
# filtro adicional; comparten el resto del gate con `refine-technical`). El
# split cubre TANTO el dispatch inicial como los comentarios sobre un issue
# ya en `Refine`/`Refined` — hay un par triage+actionable de más por cada
# uno (`comment-*-refine-technical-frontend`, `comment-*-refined-technical-
# frontend`), con la MISMA lógica: `item.repos contains lh-seller-v2-frontend` y
# `position` menor que su contraparte genérica para ganarle vía `exclusive`.
#
# ── Por qué las reglas viven acá y no en la carpeta del proyecto ──────────
#
# El loader lee `rules/` SÓLO al lado del `runner.yaml`: projects/repos/agents
# se cargan por proyecto, `rules/` no. Por eso cada regla declara su
# `projectId` a mano; no es redundancia, es el único lugar donde puede decirlo.
#
# ── Qué eventos usar, y por qué NO es sólo `issue.status_changed` ─────────
#
# `issue.status_changed` describe la llegada ("acaba de entrar a Refine")
# pero se emite UNA sola vez. Si ese dispatch se difiere por capacidad, el
# engine reintenta solo: el diff no se aprende hasta que el outcome deja de
# ser `deferred`, así que el próximo scan ve el MISMO cambio. Lo que NO cubre
# es que un humano saque la label `blocked`: eso no toca el status, así que
# no hay diff que reintente.
#
# Por eso se escucha también `projects_v2_item.edited`: GitHub lo manda ante
# cualquier edición de un campo del board del item —incluida `Labels`, que es
# el built-in que refleja las labels del issue—, con el item ya resuelto
# (`payload.item`, porque acá el id que trae el webhook ES el del
# ProjectV2Item, no el del issue). Antes se escuchaba `issues.labeled`/
# `issues.unlabeled`: esos SÍ llegan cuando cambia una label, pero
# `payload.item` queda vacío — `resolveItem()` intenta resolverlo pasando el
# node id del Issue a una query tipada para ProjectV2Item, que no matchea, y
# el intento de resolución vuelve `null` en silencio (ia-flow, diagnosticado
# 2026-09-03 sobre subscriptions#1317/lh-seller-v2-frontend#3853: la card
# quedaba en `Refine` con `blocked` sacada y esta regla nunca disparaba). El
# `when` de abajo lee `item.status`/`item.type`/`item.labels` (rutas
# anidadas): `issue.created`/`issue.status_changed` traen además los campos
# planos, pero `projects_v2_item.edited` no, así que el camino único que
# sirve para los tres es `item.*`.
#
# El precio: el `when` es el único gate, así que la condición que excluye
# `blocked` no es opcional — sin ella, sacar CUALQUIER otra label mientras el
# issue sigue en Refine re-despacharía el agente de nuevo (no en loop, pero
# sí de más).
#
# Esa última frase asumía que el redespacho era un evento aislado. No lo es:
# cuando `refiner`/`frontend-refiner` fallan, el `onError` de la regla les
# agrega `blocked` (`rules.ts`), y esa
# escritura ES OTRO `projects_v2_item.edited` — si el `when` no excluye
# `blocked`, ese evento vuelve a matchear la MISMA regla, que redespacha al
# mismo agente, que si falla otra vez vuelve a poner `blocked` (ya estaba,
# pero la escritura es igual un evento), y así. Pasó de verdad: `refine-
# technical` no traía esta condición y `refiner` encadenó 3 corridas en ~4
# minutos sobre la-haus/subscriptions#1496 (2026-09-15, cada una repitiendo
# el mismo 400 de la API — bug aparte, ya arreglado en `ia-flow`), hasta que
# un redeploy del pod cortó la cadena. `35-e2e.yaml`/`36-e2e-backend.yaml` ya
# traían este guard — acá faltaba.
#
# La contracara: el brief no puede decir "acabás de llegar", porque esta regla
# también matchea una edición cualquiera del board de una card que sigue en
# Refine. Dice lo que es verdad siempre.

id: refine-functional
name: Refine · épicas → functional-refiner
# `projects_v2_item.edited`: sintaxis nativa `tipo.action` (ia-flow >=
# v1.13.0 — julianjab/ia-flow#253), ver el comentario en `build-reentry`
# de `20-build.yaml`. Antes de #253 esto era dos reglas separadas
# (claw-agents#2466: `refine-functional` + su `-board-edit`).
# `issue.unblocked`: el intake lo emite cuando se mergea el PR del último
# prerrequisito abierto de la card (`mark_blocked_by`) — sin eso, destrabarla
# no genera ningún evento sobre ella y quedaría esperando a que algo la toque.
on: [ issue.created, issue.status_changed, projects_v2_item.edited, issue.unblocked ]
when:
  - field: item.status
    op: eq
    value: Refine
  - field: item.type
    op: eq
    value: functional
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
# Los dos gates de `Refine` son disjuntos por `task_type`, así que el orden
# es cosmético. `exclusive` igual: si algún día se solapan, que dispare uno
# y no dos agentes sobre la misma card.
position: 10
exclusive: true
do:
  - agent: functional-refiner
    brief: |-
      ## Por qué estás corriendo

      Esta tarea está en `Refine` y clasificada como **Functional**: es una
      épica. Desglosala en sub-issues técnicos por repo y dejá el PRD
      funcional en el issue padre.

      Si ya tiene sub-issues, tu corrida es de RECONCILIACIÓN: creá sólo lo
      que falte contra la tabla del Desglose, sin duplicar ni re-crear
      hijos cerrados.
