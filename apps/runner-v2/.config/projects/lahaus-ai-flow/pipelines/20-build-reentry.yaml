id: build-reentry
name: Build · sigue acá → atender lo que llegó
# `projects_v2_item.edited`: sintaxis nativa `tipo.action` (ia-flow >=
# v1.13.0 — julianjab/ia-flow#253). El matcher prueba el literal primero
# (por eso `issue.created`/`issue.status_changed` no se malinterpretan
# como tipo `issue` + action) y sólo si falla separa por el punto en
# `projects_v2_item` + `action=edited`. Antes de #253 esto había que
# partirlo en dos reglas (`build-reentry` + `build-reentry-board-edit`,
# claw-agents#2466) porque un `when` compartido no podía filtrar
# `action=edited` sin excluir de paso a los dos primeros tipos, que nunca
# lo traen.
on: [ issue.created, issue.status_changed, projects_v2_item.edited ]
when:
  - field: item.status
    op: eq
    value: Build
  - field: item.type
    op: neq
    value: functional
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
position: 20
exclusive: true
do:
  - agent: implementer
    brief: |-
      ## Por qué estás corriendo

      La tarea está en `Build`. Si ya trabajaste sobre ella, hay trabajo
      tuyo publicado y algo lo hizo volver: **empezá por las novedades**,
      no por el PRD.

      En orden de prioridad: las review threads sin resolver de tu PR (un
      humano o el reviewer leyó tu código y pidió algo concreto sobre una
      línea), el handoff `# reviewer · ❌` si hay uno, y después el
      feedback humano suelto. Arreglá exactamente eso; no rehagas lo que ya
      está bien.

      Si las novedades vienen vacías y no hay commits tuyos en la branch,
      entonces sí es tu primera corrida: implementá el PRD completo,
      empezando por validar el estado BASE del repo.
