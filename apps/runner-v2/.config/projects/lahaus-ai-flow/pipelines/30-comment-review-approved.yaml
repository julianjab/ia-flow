id: comment-review-approved
name: Review (aprobado) · comentario → triage → implementer si accionable
on: [ issue_comment ]
when:
  - field: action
    op: eq
    value: created
  # El engine marca TODO lo que él mismo publica con `<!-- ia-flow: -->`
  # al pie del comentario — sin excluirlo, el propio veredicto del
  # reviewer o el resumen del implementer re-dispararían este triage
  # sobre sí mismos. El filtro es por ese marcador, NO por autor: en modo
  # `github-app` todo sale de la misma cuenta.
  - field: body
    op: matches
    value: '^(?![\s\S]*<!-- ia-flow:)'
  - field: item.status
    op: eq
    value: Review
  - field: item.labels
    op: contains
    value: 'reviewed'
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
position: 30
exclusive: true
do:
  - agent: comment-triage
    brief: |-
      ## Por qué estás corriendo

      **{{event.payload.author}}** comentó en el PR
      #{{event.payload.issueNumber}} (comment id: `{{event.payload.commentId}}`), que ya estaba aprobado (`reviewed`).

      ## Comentario a clasificar

      {{event.payload.body}}
  - agent: implementer
    brief: |-
      ## Por qué estás corriendo

      El PR ya estaba aprobado (`reviewed`) y llegó un comentario que
      `comment-triage` marcó como accionable: **{{input.summary}}**

      Leelo, aplicá exactamente lo que pide, y pusheá — al arrancar, el
      engine ya sacó `reviewed`, así que el próximo push vuelve a pasar por el
      reviewer.
routes:
  comment-triage:
    routes:
      actionable:
        to:
          - ref: implementer
