# ── Comentario humano en Review ─────────────────────────────────────────
#
# Antes, mientras el PR esperaba al reviewer, un comentario humano entraba
# en su próxima corrida por `{{task.comments}}` sin necesitar nada más —
# porque `review` (arriba) escuchaba cualquier `projects_v2_item.edited`
# sobre la columna, así que CUALQUIER evento (incluido un comentario que de
# paso tocara una label) la volvía a disparar. Desde que `review` pasó a
# `pull_request: opened` puro (un solo disparo por PR), eso ya no pasa: un
# comentario mientras el PR sigue sin veredicto no re-dispara nada por sí
# solo. `comment-review-pending` cubre exactamente ese hueco.
#
# El triage (`comment-triage`, en `projects/lahaus-ai-flow/agents/
# 15-comment-triage.yaml`) decide si ese comentario amerita reabrir el
# ciclo antes de correr al implementer. Su decisión es la salida que elige:
# `routes.comment-triage.actionable.to` la lleva al implementer, con el
# pedido resumido en `{{input.summary}}`. El mecanismo del agente está
# documentado en ese archivo.
#
# Va directo al `implementer`, sin volver a correr al `reviewer` primero:
# mismo criterio que `comment-review-approved` de abajo — el comentario ya
# es un pedido concreto, no algo que necesite un veredicto de nuevo antes.
id: comment-review-pending
name: Review (sin veredicto) · comentario → triage → implementer si accionable
on: [ issue_comment ]
when:
  - field: action
    op: eq
    value: created
  - field: body
    op: matches
    value: '^(?![\s\S]*<!-- ia-flow:)'
  - field: item.status
    op: eq
    value: Review
  - field: item.labels
    op: notContains
    value: 'reviewed'
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
position: 25
exclusive: true
do:
  - agent: comment-triage
    brief: |-
      ## Por qué estás corriendo

      **{{event.payload.author}}** comentó en el issue/PR
      #{{event.payload.issueNumber}} (comment id: `{{event.payload.commentId}}`),
      que sigue en `Review` esperando el veredicto del reviewer.

      ## Comentario a clasificar

      {{event.payload.body}}
  - agent: implementer
    brief: |-
      ## Por qué estás corriendo

      Mientras el PR esperaba el veredicto del reviewer, llegó un
      comentario que `comment-triage` marcó como accionable:
      **{{input.summary}}**

      Leelo, aplicá exactamente lo que pide, y pusheá.
routes:
  comment-triage:
    routes:
      actionable:
        to:
          - ref: implementer
