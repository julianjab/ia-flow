id: ci-red
name: CI · rojo sobre un PR → el implementer del repo
# Un paso por implementer: `firstMatch` corre el primero cuyo `when` pasa (frontend antes).
on: [ check_suite, workflow_run ]
when:
  - { field: action, op: eq, value: completed }
  - { field: conclusion, op: eq, value: failure }
  - { field: prNumber, op: exists }
  - { field: item.blocked, op: neq, value: true }
scope:
  projectId: lahaus-ai-flow
position: 20
exclusive: true
firstMatch: true
do:
  - agent: frontend-implementer
    when:
      - { field: repo, op: eq, value: lh-seller-v2-frontend }
    brief: &ci-red |-
      ## Por qué estás corriendo

      El CI del PR #{{event.payload.prNumber}} terminó en rojo:
      **{{event.payload.name}}** — {{event.payload.url}}

      Andá a ver ese check antes que nada. Si falla por tu diff (lint,
      formato, un test), arreglalo y volvé a pushear: la validación local
      del repo es lo que tenía que haberlo evitado, así que corrila y no
      confíes en el ojo. Si falla por infra ajena al cambio, no lo arregles
      a la fuerza — decilo en tu resumen y dejá que el reviewer lo evalúe.
  - agent: implementer
    brief: *ci-red
