# ── Comentario humano en Build ──────────────────────────────────────────
#
# Un comentario suelto, sin que status ni labels cambien, no dispara
# `build-reentry`: no es un `issue.status_changed` ni un `projects_v2_item.edited`.
# Sin esto quedaba esperando a que algo más despertara al implementer —una
# review, un CI rojo— mientras {{task.comments}} lo tenía pero nadie corría
# para leerlo.
#
# El triage (`comment-triage`, en `projects/lahaus-ai-flow/agents/
# 15-comment-triage.yaml`) es el gate barato antes de correr un implementer
# completo: Haiku, sin tools de escritura, sólo decide si el comentario pide
# un cambio real. Su decisión es la salida que elige (`actionable` /
# `not_actionable`): esta regla declara a qué agente lleva `actionable`
# (`routes.comment-triage.actionable.to`), y el triage le entrega el pedido
# resumido como `input` — `{{input.summary}}` en el brief. El triage no
# sabe a qué agente despachar (no conoce status ni task_type): quien decide
# es la regla.
#
# Un comentario que llega mientras el implementer todavía está corriendo no
# pasa por acá: se lo ofrecen primero a él, que lo acepta por su `injects`
# (`agents/20-implementer.yaml`) y lo lee en su próxima vuelta. Esta regla
# corre cuando no hay nada corriendo, o con lo que él no llegó a leer.
#
# No hace falta separar por `task_type` como en `10-refine.yaml`: acá un
# solo agente (`implementer`) atiende toda la columna.
id: comment-build
name: Build · comentario → triage → implementer si accionable
on: [ issue_comment ]
when:
  - field: action
    op: eq
    value: created
  # El engine marca TODO lo que él mismo publica con `<!-- ia-flow: -->`
  # al pie del comentario — sin excluirlo, cada comentario del propio
  # implementer/reviewer re-dispararía este triage sobre sí mismo. El
  # filtro es por ese marcador, NO por autor: en modo `github-app` todo
  # sale de la misma cuenta.
  - field: body
    op: matches
    value: '^(?![\s\S]*<!-- ia-flow:)'
  - field: item.status
    op: eq
    value: Build
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
position: 30
exclusive: true
do:
  - agent: comment-triage
    brief: |-
      ## Por qué estás corriendo

      **{{event.payload.author}}** comentó en el issue/PR
      #{{event.payload.issueNumber}} (comment id: `{{event.payload.commentId}}`).

      ## Comentario a clasificar

      {{event.payload.body}}
  - agent: implementer
    brief: |-
      ## Por qué estás corriendo

      Un humano comentó en el issue/PR mientras la tarea está en `Build`,
      y `comment-triage` lo marcó como accionable:
      **{{input.summary}}**

      Leé el comentario completo y aplicá exactamente lo que pide; no
      rehagas lo que ya está bien.
routes:
  comment-triage:
    routes:
      actionable:
        to:
          - ref: implementer
