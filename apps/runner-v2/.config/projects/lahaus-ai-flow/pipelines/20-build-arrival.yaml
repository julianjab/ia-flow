id: build-arrival
name: Build · recién llegado → el implementer del repo construye desde cero
# Acaba de pasar a Build desde una columna que no es Review: primera corrida sobre el PRD. Un paso
# por implementer: `firstMatch` corre el primero cuyo `when` pasa (frontend antes que el resto).
on: [ issue.status_changed ]
when:
  - { field: to, op: eq, value: Build }
  - { field: from, op: neq, value: Review }
  - { field: task_type, op: neq, value: functional }
  - { field: item.blocked, op: neq, value: true }
scope:
  projectId: lahaus-ai-flow
position: 10
exclusive: true
firstMatch: true
# La card llegó a Build con un agente trabajando en ella: se le avisa que ceda y
# el implementer arranca apenas cierre.
ifRunning: interrupt
do:
  - agent: frontend-implementer
    when:
      - { field: item.repos, op: contains, value: lh-seller-v2-frontend }
    brief: |-
      ## Por qué estás corriendo

      La tarea acaba de pasar de `{{event.payload.from}}` a `Build`: un
      humano aprobó el PRD y esta es la **primera corrida** sobre él.

      Implementá el PRD completo desde cero. Empezá por validar el estado
      BASE del repo (es tu única oportunidad de distinguir "ya venía roto"
      de "lo rompí yo"), después explorá —incluido el Figma linkeado, si
      el PRD o el issue traen uno—, después escribí, y antes de pushear
      volvé a leer ese mismo Figma para validar tu implementación contra
      él.

      No hay trabajo previo tuyo que atender: si hay comentarios en el
      issue, son contexto de refinamiento, no pedidos de cambio sobre
      código que todavía no existe.
  - agent: implementer
    brief: |-
      ## Por qué estás corriendo

      La tarea acaba de pasar de `{{event.payload.from}}` a `Build`: un
      humano aprobó el PRD y esta es la **primera corrida** sobre él.

      Implementá el PRD completo desde cero. Empezá por validar el estado
      BASE del repo (es tu única oportunidad de distinguir "ya venía roto"
      de "lo rompí yo"), después explorá, después escribí.

      No hay trabajo previo tuyo que atender: si hay comentarios en el
      issue, son contexto de refinamiento, no pedidos de cambio sobre
      código que todavía no existe.
