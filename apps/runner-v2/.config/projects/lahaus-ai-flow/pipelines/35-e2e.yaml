id: e2e
name: On-demand · label e2e-test → la verificación del repo de la task
# Un humano agregó `e2e-test` a una card en Review: frontend → verificación visual en un browser,
# subscriptions → smoke test de los endpoints contra staging. No es `exclusive`: corre al lado
# de lo que corresponda a la columna.
on: [ issue.created, issue.status_changed, projects_v2_item.edited, issue.unblocked ]
when:
  - { field: item.labels, op: contains, value: e2e-test }
  - { field: item.type, op: neq, value: functional }
  - { field: item.status, op: eq, value: Review }
  - { field: item.blocked, op: neq, value: true }
  # Una edición de la card que GitHub hace solo, como eco de lo que hizo un agente (abrir el PR
  # vincula «Linked pull requests», pedir review toca «Reviewers», crear sub-issues mueve
  # «Sub-issues progress»; y «Working», la marca que pone y saca el propio runner mientras la
  # task corre), no es una novedad: sin esto el implementer que abre su PR se
  # re-dispara a sí mismo. `fieldName` sólo viene en `projects_v2_item.edited`; en el resto de
  # los eventos no está y `notIn` pasa.
  - { field: fieldName, op: notIn, value: [ Linked pull requests, Reviewers, Sub-issues progress, Working ] }
scope:
  projectId: lahaus-ai-flow
position: 40
firstMatch: true
do:
  - agent: e2e-visual-qa
    when:
      - { field: item.repos, op: contains, value: lh-seller-v2-frontend }
    brief: |-
      ## Por qué estás corriendo

      Un humano agregó la label `e2e-test` a esta card, que está en
      Review — está pidiendo verificación visual on-demand, no es un
      paso automático del pipeline. Corré el flujo relevante en un
      browser real contra el entorno de pruebas, dejá la evidencia y tu
      veredicto.
  - agent: e2e-backend-qa
    when:
      - { field: item.repos, op: contains, value: subscriptions }
    brief: |-
      ## Por qué estás corriendo

      Un humano agregó la label `e2e-test` a esta card, que está en
      Review — está pidiendo un smoke test de los endpoints reales
      contra staging, no es un paso automático del pipeline. Pegale a
      los endpoints que el cambio tocó y dejá tu veredicto.
