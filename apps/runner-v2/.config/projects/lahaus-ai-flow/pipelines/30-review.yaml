# Columna `Review` — el quality gate.
#
# El trigger es que la card LLEGUE a `Review` (`issue.status_changed`) con un PR
# abierto. El implementer la mueve ahí recién con el CI en verde (su `wait-ci`),
# así que el reviewer mira un PR con el CI terminado; y como la card vuelve a
# Review en cada ciclo (back_to_build → Build → implementer → Review), cubre la
# primera review Y la re-review de un PR ya corregido. Un humano que mueve la
# card a Review también lo dispara.
#
# Antes era `pull_request: opened`: GitHub lo manda UNA vez por PR, así que
# después de un ciclo de corrección el reviewer nunca volvía a mirar el PR
# (los pushes siguientes son `synchronize`, que tampoco sirve: el implementer
# pushea varias veces por corrida, con el CI a medio correr).
#
# Sin loops: si aprueba, la card se queda en Review con `reviewed` (sin cambio
# de status); si pide cambios, vuelve a Build. El eco de sus escrituras en la
# card (Working, labels) llega como `projects_v2_item.edited`, que esta regla
# no escucha.
#
# ── Una sola regla ──────────────────────────────────────────────────────
#
# La primera review y la re-review no piden encargos distintos — el reviewer
# valida el diff completo contra el PRD las dos veces, y su Paso 5 ya dice que
# mire cuáles de sus hilos anteriores quedaron atendidos.

id: review
name: Review · la card llega a Review con PR → validar el diff y dar veredicto
on: [ issue.status_changed ]
when:
  - { field: to, op: eq, value: Review }
  # Sin PR abierto no hay nada que revisar (ej. una card movida a mano sin PR).
  - { field: task.pr.number, op: exists }
  - { field: item.blocked, op: neq, value: true }
scope:
  projectId: lahaus-ai-flow
position: 10
exclusive: true
do:
  - agent: reviewer
    brief: |-
      ## Por qué estás corriendo

      La tarea llegó a Review con el PR #{{task.pr.number}} ({{task.pr.url}})
      y su CI terminado. Sos el último gate antes de que un humano lo mire. Si
      ya lo revisaste en un ciclo anterior, validá el diff completo de nuevo y
      mirá qué de tus hallazgos quedó atendido.

      Validá el diff completo con las cinco dimensiones y re-ejecutá lint y
      tests localmente — el tilde del implementer en el PRD es su claim, no
      tu evidencia.

      Tu output son los comentarios sobre el PR y el veredicto. No arregles
      el código ni edites la descripción del PR: eso es del implementer, y
      si algo falla vuelve a él por `back_to_build` con tu handoff.
