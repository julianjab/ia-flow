id: refine-technical-frontend
name: Refine · técnicas de repos frontend → frontend-refiner
# `projects_v2_item.edited`, no `issues.labeled`/`issues.unlabeled`: para
# esos dos eventos `resolveItem()` en ia-flow resuelve `payload.item` en
# `null` (pasa el node id del Issue a una query GraphQL tipada para
# ProjectV2Item, que no matchea) — diagnosticado en claw-agents#2196. Con
# `item` en null, el `when` de abajo (que lee `item.status`/`item.type`/
# `item.repos`) no puede matchear nunca sobre esos eventos, así que sacar
# `blocked` de una card técnica frontend en Refine no reactivaba
# `frontend-refiner`. Mismo patrón que `build-reentry-frontend`
# (`rules/22-build-frontend.yaml`).
# `projects_v2_item.edited`: sintaxis nativa `tipo.action` (ia-flow >=
# v1.13.0 — julianjab/ia-flow#253), ver el comentario en `build-reentry`
# de `20-build.yaml`. Antes de #253 esto era dos reglas separadas
# (claw-agents#2466: `refine-technical-frontend` + su `-board-edit`).
on: [ issue.created, issue.status_changed, projects_v2_item.edited ]
when:
  - field: item.status
    op: eq
    value: Refine
  - field: item.type
    op: neq
    value: functional
  # El único filtro que distingue esta regla de `refine-technical` de
  # abajo. `item.repos` es un array (issues de un solo repo traen uno
  # solo) — `contains` es membership, así que matchea aunque el campo
  # tenga más de un valor. No hay un campo de "tags de repo": la única
  # señal disponible es el nombre exacto — sumar un segundo repo frontend
  # es agregar otra fila `item.repos contains <repo>` con `logic: or`, no
  # tocar `12-frontend-refiner.yaml`.
  - field: item.repos
    op: contains
    value: lh-seller-v2-frontend
scope:
  projectId: lahaus-ai-flow
# MENOR que `refine-technical` (20) a propósito: `exclusive` corta a las
# reglas de MENOR prioridad que también matchean el mismo evento, así que
# con esta posición una tarea técnica de `lh-seller-v2-frontend` nunca
# llega a `refine-technical` — sale de acá antes. Si esta regla no
# existiera, `refine-technical` (que no filtra por repo) la tomaría igual.
position: 15
exclusive: true
do:
  - agent: frontend-refiner
    brief: |-
      ## Por qué estás corriendo

      Esta tarea está en `Refine`, es técnica y vive en un repo frontend:
      produci el PRD accionable para que un implementador escriba el
      código sin más contexto. Si la descripción linkea un diseño de
      Figma, leelo con `get_figma_data` antes de escribir el PRD — no lo
      asumas del título.

      Arrancá por el Paso 0 — el issue puede llegar ya refinado (por un
      humano, o por vos en una corrida que volvió acá desde `Build`), y en
      ese caso tu aporte es la VERIFICACIÓN contra el código real, no
      reescribir el body.
