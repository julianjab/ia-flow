# ── Comentario humano en Refine/Refined ────────────────────────────────────
#
# Un comentario suelto, sin que status ni labels cambien, no dispara ninguna
# regla de arriba: no es un `issue.status_changed` ni un `projects_v2_item.edited`.
# Antes de esto quedaba esperando a que algo más despertara al refiner, y
# mientras tanto {{task.comments}} lo tenía pero nadie corría para leerlo.
#
# `Refined` en particular no tenía NINGUNA regla escuchando — el refiner se
# detiene ahí a propósito ("pasar a Build es decisión humana"), así que sin
# esto un comentario en esa columna no tenía ningún efecto hasta la
# aprobación.
#
# El triage (`comment-triage`, en `projects/lahaus-ai-flow/agents/
# 15-comment-triage.yaml`) es el gate barato antes de correr un refiner
# completo: Haiku, sin tools de escritura, sólo decide si el comentario pide
# un cambio real. Su decisión es la salida que elige (`actionable` /
# `not_actionable`): esta regla declara a qué agente lleva `actionable`
# (`routes.comment-triage.actionable.to`), y el triage le entrega el pedido
# resumido como `input` — `{{input.summary}}` en el brief. El triage no
# sabe a qué agente despachar (no conoce status ni task_type): quien decide
# es la regla.
#
# Seis pares (status × task_type) — el mismo corte que ya separan
# `refine-functional`/`refine-technical` arriba, más el split de frontend
# (uno en `Refine`, uno en `Refined`; el técnico se separa en
# frontend/genérico igual que el dispatch inicial, el funcional no porque
# `functional-refiner` no usa `figma-mcp`).

id: comment-refine-technical-frontend
name: Refine (técnica, frontend) · comentario → triage → frontend-refiner si accionable
on: [ issue_comment ]
when:
  - field: action
    op: eq
    value: created
  - field: body
    op: matches
    value: '^(?![\s\S]*<!-- ia-flow:)'
  - field: item.status
    op: eq
    value: Refine
  - field: item.type
    op: neq
    value: functional
  - field: item.repos
    op: contains
    value: lh-seller-v2-frontend
scope:
  projectId: lahaus-ai-flow
# MENOR que `comment-refine-technical` (30): mismo mecanismo que
# `refine-technical-frontend` arriba — `exclusive` corta a la genérica
# para un comentario sobre un issue de este repo.
position: 25
exclusive: true
do:
  - agent: comment-triage
    brief: |-
      ## Por qué estás corriendo

      **{{event.payload.author}}** comentó en el issue/PR
      #{{event.payload.issueNumber}} (comment id: `{{event.payload.commentId}}`).

      ## Comentario a clasificar

      {{event.payload.body}}
  - agent: frontend-refiner
    brief: |-
      ## Por qué estás corriendo

      Un humano comentó en el issue mientras el PRD estaba en `Refine`, y
      `comment-triage` lo marcó como accionable: **{{input.summary}}**

      Leé el comentario completo en el issue y ajustá el PRD contra lo que
      pide — no lo rehagas desde cero. Si el comentario referencia un
      cambio de diseño, releé el Figma linkeado con `get_figma_data` en
      vez de asumir qué cambió.
routes:
  comment-triage:
    routes:
      actionable:
        to:
          - ref: frontend-refiner
