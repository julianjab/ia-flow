# Feedback sobre el PR — el implementer despierta por el evento, no por el scan.
#
# ── Cómo llega el item ────────────────────────────────────────────────────
#
# Los eventos de GitHub (`pull_request_review`, `check_suite`/`workflow_run`)
# traen el PR y el scope, nunca el item del board: el webhook habla de un PR
# y no sabe de qué issue cuelga.
# La acción del agente exige un item, y lo resuelve desde el scope
# (`prNumber` → el item del board que linkea ese PR, por sus dev-links;
# `issueId` → lookup directo).
#
# ── Por qué hacen falta ───────────────────────────────────────────────────
#
# `20-build.yaml/build-reentry` escucha cambios de status y de labels, y una
# review de GitHub o un CI rojo por sí solos no producen ninguno: no mueven
# la card ni tocan sus labels. Sin estas reglas, un `changes_requested` o un
# CI rojo quedarían esperando a que algo más despierte al implementer.
#
# Además ganan precisión: el brief nombra el PR y el revisor concretos, y
# `when` separa el caso que exige trabajo del que no.
#
# ── El solapamiento con build-reentry es deliberado ───────────────────────
#
# Pueden matchear las dos cuando la review coincide con un cambio de label
# (alguien pide cambios y además saca `blocked` a mano). No produce dos runs:
# el lock por task y el `workingMarker` frenan al segundo.

id: pr-changes-requested
name: PR · pidieron cambios → implementer
on: [ pull_request_review ]
when:
  # El traductor ya no filtra por action (ver ia-flow #<pendiente>) —
  # `edited`/`dismissed` también llegan acá, y `action: submitted` es lo
  # que antes hacía el tipo `pr.review_submitted`.
  - field: action
    op: eq
    value: submitted
  # `approved` y `commented` no son trabajo: una aprobación cierra el ciclo
  # (la espera el humano que mergea) y un comentario suelto puede ser
  # cualquier cosa. Sólo `changes_requested` afirma que hay algo que hacer.
  - field: state
    op: eq
    value: changes_requested
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
position: 10
exclusive: true
do:
  - agent: implementer
    brief: |-
      ## Por qué estás corriendo

      **{{event.payload.reviewer}}** pidió cambios en el PR
      #{{event.payload.pr.number}}. No es tu primera corrida sobre esta
      tarea: hay código tuyo publicado y alguien lo leyó.

      Empezá por las review threads sin resolver de ese PR — cada una es un
      pedido sobre una línea concreta. Arreglá el código, contestá en el
      hilo con `reply_pr_review_thread` diciendo qué hiciste, y cerralo con
      `resolve_pr_review_thread` sólo si quedó efectivamente atendido.

      No rehagas lo que ya está bien, y no toques el alcance del PRD salvo
      que el pedido venga de un humano y lo redefina explícitamente.
