id: build-reentry
name: Build · sigue acá → el implementer del repo atiende lo que llegó
# Cualquier otro evento con la card en Build: volvió de Review, se editó, se destrabó. Atender las
# novedades, no rehacer. Un paso por implementer: `firstMatch` corre el primero que pasa.
#
# `issue.unblocked`: el intake lo emite cuando se mergea el PR del último prerrequisito abierto
# de la card (`mark_blocked_by`) — sin eso, destrabarla no genera ningún evento sobre ella.
on: [ issue.created, issue.status_changed, projects_v2_item.edited, issue.unblocked ]
when:
  - { field: item.status, op: eq, value: Build }
  - { field: item.type, op: neq, value: functional }
  - { field: item.blocked, op: neq, value: true }
  # Una edición de la card que GitHub hace solo, como eco de lo que hizo un agente (abrir el PR
  # vincula «Linked pull requests», pedir review toca «Reviewers», crear sub-issues mueve
  # «Sub-issues progress»; y «Working», la marca que pone y saca el propio runner mientras la
  # task corre), no es una novedad: sin esto el implementer que abre su PR se
  # re-dispara a sí mismo. `fieldName` sólo viene en `projects_v2_item.edited`; en el resto de
  # los eventos no está y `notIn` pasa.
  - { field: fieldName, op: notIn, value: [ Linked pull requests, Reviewers, Sub-issues progress, Working ] }
scope:
  projectId: lahaus-ai-flow
position: 20
exclusive: true
firstMatch: true
# La card llegó a esta columna con un agente trabajando en ella (otra columna):
# se le avisa que ceda y esta regla corre apenas cierre. Sólo un cambio de
# status interrumpe; una edición de otro campo o un desbloqueo esperan.
ifRunning: interrupt
interruptOn:
  - on: [ issue.status_changed ]
do:
  - agent: frontend-implementer
    when:
      - { field: item.repos, op: contains, value: lh-seller-v2-frontend }
    brief: |-
      ## Por qué estás corriendo

      La tarea está en `Build`. Si ya trabajaste sobre ella, hay trabajo
      tuyo publicado y algo lo hizo volver: **empezá por las novedades**,
      no por el PRD.

      En orden de prioridad: las review threads sin resolver de tu PR (un
      humano o el reviewer leyó tu código y pidió algo concreto sobre una
      línea), el handoff `# reviewer · ❌` si hay uno, y después el
      feedback humano suelto. Arreglá exactamente eso; no rehagas lo que ya
      está bien. Si el pedido toca un cambio de diseño, releé el Figma
      linkeado con `get_figma_data` en vez de asumir qué cambió.

      Si las novedades vienen vacías y no hay commits tuyos en la branch,
      entonces sí es tu primera corrida: implementá el PRD completo,
      empezando por validar el estado BASE del repo.
  - agent: implementer
    brief: |-
      ## Por qué estás corriendo

      La tarea está en `Build`. Si ya trabajaste sobre ella, hay trabajo
      tuyo publicado y algo lo hizo volver: **empezá por las novedades**,
      no por el PRD.

      En orden de prioridad: las review threads sin resolver de tu PR (un
      humano o el reviewer leyó tu código y pidió algo concreto sobre una
      línea), el handoff `# reviewer · ❌` si hay uno, y después el
      feedback humano suelto. Arreglá exactamente eso; no rehagas lo que ya
      está bien.

      Si las novedades vienen vacías y no hay commits tuyos en la branch,
      entonces sí es tu primera corrida: implementá el PRD completo,
      empezando por validar el estado BASE del repo.
