# Verificación e2e ON-DEMAND para `subscriptions` — smoke test de
# endpoints reales, no visual. Hermana de `35-e2e.yaml`: mismo mecanismo
# (label `e2e-test`, sólo en Review, no en Build), mismo filtro de repo en
# el `when` sobre `item.repos` (NO `repoName` — ver el porqué completo en
# `35-e2e.yaml`: `repoName` + `projects_v2_item.edited` es un bug silencioso,
# la regla nunca dispara porque ese evento webhook no pobla `scope.repos`) —
# ver esa regla para el razonamiento completo de CADA decisión de abajo, que
# aplica idéntico acá salvo el repo/agente. No se repite la explicación
# larga; sólo lo que difiere.
#
# ── Lo único que cambia respecto a `35-e2e.yaml` ──────────────────────────
#
# - `item.repos contains subscriptions` en vez de `lh-seller-v2-frontend` — el
#   agent-host de este agente (`remote:backend-python-tester`, declarado
#   en `agents/41-e2e-backend.yaml`) sólo tiene el toolchain Python/uv;
#   correr esto contra otro repo fallaría ahí, no en esta regla.
# - `agent: e2e-backend-qa` en vez de `e2e-visual-qa`.
#
# Misma label (`e2e-test`) para los dos — no hace falta una label
# separada por repo: `repoName` ya escoge la regla correcta, así que un
# humano agrega la misma label sin pensar en qué agente va a correr.
#
# ⚠️ Misma dependencia externa sin la cual esto nunca despacha: ver el
# encabezado de `agents/41-e2e-backend.yaml` — `remoteProviders: true` ya
# está prendido, falta el agent-host `backend-python-tester` en sí,
# registrado y corriendo.

id: e2e-backend
name: On-demand · label e2e-test → smoke test de subscriptions
# `projects_v2_item.edited`: sintaxis nativa `tipo.action` (ia-flow >=
# v1.13.0 — julianjab/ia-flow#253), ver el comentario en `build-reentry`
# de `20-build.yaml`. Antes de #253 esto era dos reglas separadas
# (claw-agents#2466: `e2e-backend` + su `-board-edit`).
# `issue.unblocked`: el intake lo emite cuando se mergea el PR del último
# prerrequisito abierto de la card (`mark_blocked_by`) — sin eso, destrabarla
# no genera ningún evento sobre ella y quedaría esperando a que algo la toque.
on: [ issue.created, issue.status_changed, projects_v2_item.edited, issue.unblocked ]
when:
  - field: item.repos
    op: contains
    value: subscriptions
  - field: item.labels
    op: contains
    value: 'e2e-test'
  - field: item.type
    op: neq
    value: functional
  - field: item.status
    op: eq
    value: Review
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
position: 41
do:
  - agent: e2e-backend-qa
    brief: |-
      ## Por qué estás corriendo

      Un humano agregó la label `e2e-test` a esta card, que está en
      Review — está pidiendo un smoke test de los endpoints reales
      contra staging, no es un paso automático del pipeline. Pegale a
      los endpoints que el cambio tocó y dejá tu veredicto.
