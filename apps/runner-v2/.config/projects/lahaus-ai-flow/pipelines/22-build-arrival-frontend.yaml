# Activación de `frontend-implementer` (22-frontend-implementer.yaml) —
# separada de `20-build.yaml` a propósito, mismo motivo que
# `15-refine-frontend.yaml` sobre `10-refine.yaml`: poder probarla local sin
# tocar el archivo que gobierna el pipeline genérico.
#
# ⚠️ NO mergear/desplegar este archivo hasta que `figma-mcp` tenga una URL
# pública real — ver la nota bloqueante en `runner.yaml` y en el header de
# `15-refine-frontend.yaml`. Con las reglas de acá activas y `exclusive:
# true`, eso deja los issues de `lh-seller-v2-frontend` en `Build` SIN NINGÚN
# implementer — ni siquiera caen al `implementer` genérico de
# `20-build.yaml`, porque estas reglas les ganan por `position`.
#
# Las tres reglas, mismo esqueleto que `20-build.yaml` (leé su header para el
# porqué de "dos encargos, dos reglas" y el porqué de `from != Review`),
# cada una con el filtro `item.repos contains lh-seller-v2-frontend` de más y
# posición MENOR que su par genérica — así una tarea de este repo nunca
# llega a `20-build.yaml`, que no filtra por repo:
#
#   Build (llegada)     → build-arrival-frontend      (pos 5  vs 10)
#   Build (vuelta/sigue) → build-reentry-frontend      (pos 15 vs 20)
#   Build (comentario)  → comment-build-frontend       (pos 25 vs 30)

id: build-arrival-frontend
name: Build (frontend) · recién llegado → construir desde cero
on: [ issue.status_changed ]
when:
  - field: to
    op: eq
    value: Build
  - field: from
    op: neq
    value: Review
  - field: task_type
    op: neq
    value: functional
  # Único filtro que distingue esta regla de `build-arrival` —mismo
  # mecanismo que `refine-technical-frontend` en `15-refine-frontend.yaml`,
  # ver ese archivo para el porqué de `item.repos contains <repo>` como membership
  # y qué hacer si se suma un segundo repo frontend.
  - field: repos
    op: contains
    value: lh-seller-v2-frontend
  - field: item.blocked
    op: neq
    value: true
scope:
  projectId: lahaus-ai-flow
position: 5
exclusive: true
do:
  - agent: frontend-implementer
    brief: |-
      ## Por qué estás corriendo

      La tarea acaba de pasar de `{{event.payload.from}}` a `Build`: un
      humano aprobó el PRD y esta es la **primera corrida** sobre él.

      Implementá el PRD completo desde cero. Empezá por validar el estado
      BASE del repo (es tu única oportunidad de distinguir "ya venía roto"
      de "lo rompí yo"), después explorá —incluido el Figma linkeado, si
      el PRD o el issue traen uno—, después escribí, y antes de pushear
      volvé a leer ese mismo Figma para validar tu implementación contra
      él.

      No hay trabajo previo tuyo que atender: si hay comentarios en el
      issue, son contexto de refinamiento, no pedidos de cambio sobre
      código que todavía no existe.
