# Repos del proyecto — fuente estática en modo IA_FLOW_REPOS_REPO=yaml.
#
# `path` es el clone DENTRO del contenedor del runner. Un provider en OTRA
# máquina (el gateway de la mac) lo ignora si no existe en su disco y clona
# por las coordenadas `githubOwner`/`githubRepo` bajo su GATEWAY_REPOS_BASE.
# Declararlo también evita que el engine intente persistir un path que
# descubrió — en modo YAML el repositorio es read-only y esa escritura tira.
#
# El valor NO es arbitrario: tiene que ser donde el provisioner de este deploy
# (`settings.workspace: true` en runner.yaml) va a clonar, o sea
# `<reposBase>/<githubOwner>/<githubRepo>` con reposBase = IA_FLOW_CONFIG_DIR
# + /repos — /state/repos acá, el volumen que el deploy persiste.
# Si no coincide no se rompe nada: el primer run avisa con un warn que el path
# no existe y clona por coordenadas igual — pero el warn se repite para
# siempre porque el YAML es read-only y nadie corrige la entrada.
#
# `name` tiene que matchear el `repo` de source.config del proyecto.
# El `projectId` sale del nombre de la carpeta — no se declara acá.
#
# `workflow: worktree` — el implementer escribe localmente cuando el run
# aterriza en una máquina con filesystem (bash_run/fs_write): el provisioner
# materializa el worktree de la task, parado en `{{task.branch}}`, y el git
# context del prompt describe esa branch. Con `main`, la sesión quedaría
# parada en main y el git context diría "commit directly on main",
# contradiciendo al prompt, que exige comitear en la branch de la task.
- name: subscriptions
  description: >-
    Backend de suscripciones (Python FastAPI, uv). Multi-módulo — core/,
    app/subscriptions/, app/client-api/, app/ads/, scripts/, cada uno con su
    pyproject.toml: ruff/pytest se corren DENTRO del módulo tocado, nunca en
    la raíz. Commits con commitizen (type(scope) con scope = módulo).
  path: /state/repos/la-haus/subscriptions
  githubOwner: la-haus
  githubRepo: subscriptions
  workflow: worktree
  # Pedido de review en Slack (POST /api/tasks/:id/slack-review y la tool
  # `request_slack_review`). Los campos van al RAÍZ de la entrada — el schema
  # del repo no tiene `settings`: anidarlos ahí los descarta en silencio y el
  # botón queda apagado por "no tiene canal configurado".
  # `slackReviewChannel` se llama igual acá y en `settings` del proyecto, de
  # donde se hereda campo por campo cuando el repo no lo declara.
  slackReviewChannel: C0AGHAKPG6T
  slackReviewers:
    - id: U0AHRSSLF4G
      name: gordo
      isBot: true
    - id: U0AGVLRV6A2
      name: vitruvio
      isBot: true

# Mismo clone, para el proyecto alimentado por el board 119. El índice de
# repos es `(name, projectId)`, así que repetir `name: subscriptions` con
# otro projectId no colisiona — y hace falta, porque sin una entrada para ese
# projectId el engine no sabe dónde vive el repo y la persistencia tira por
# ser read-only.
