# Verificación e2e on-demand: corre el flujo en un browser real contra un
# entorno de pruebas y deja el veredicto en el PR/issue.
#
# ── Activación (ver pipelines/35-e2e.yaml) ─────────────────────────────────
#
# No es un paso fijo del pipeline (a diferencia de refiner/implementer/
# reviewer): lo dispara un HUMANO agregando la label `e2e-test` a la card,
# sólo en Review — es la única columna donde `{{task.branch}}` está
# garantizada (ver el porqué completo en `pipelines/35-e2e.yaml`).
# `projects_v2_item.edited` es lo único que puede avisar eso — ver el
# encabezado de esa pipeline para el porqué de ese evento y no `issues.labeled`.
#
# Método en `systemPrompts` propio: este agente no comparte los tres bloques
# de `project.yaml` con el resto del roster (rol distinto — no lee/escribe
# Python ni Ruby, corre un browser), así que trae su propio bloque de
# sistema en vez de heredar "cómo se valida un repo".
#
# ── Dónde corre ─────────────────────────────────────────────────────────
#
# Contra la Messages API, con `fs_*` y `bash_run` sobre WORKSPACE_DIR: el
# clone, el `yarn install` y el Chromium tienen que estar ahí. En ia-flow
# este agente corría en un agent-host remoto con ese toolchain; este runner
# no tiene agent-hosts.
#
# Un e2e sin browser no es un e2e degradado, es un veredicto inventado: si el
# toolchain no está, el camino correcto es `fail_turn` (ajeno al cambio),
# nunca `submit_passed`.
#
# ── Por qué no escribe código ──────────────────────────────────────────────
#
# Corre lo que el repo ya tiene y reporta. Si falta cobertura para el flujo
# pedido, eso es un hallazgo que vuelve al implementer — no algo que este
# agente arregla él mismo: calificaría su propio trabajo.
#
# ── El ciclo (ver pipelines/35-e2e.yaml) ───────────────────────────────────
#
#   activa   projects_v2_item.edited + label `e2e-test` agregada, repo
#            lh-seller-v2-frontend, sin `blocked`
#   éxito    -e2e-test         → se ve funcionando; la label se consume y
#            queda como estaba (no mueve status)
#   ajuste   back_to_build     → Status=Build, -e2e-test: hay que arreglar
#            código; un humano vuelve a agregar `e2e-test` cuando quiera
#            re-verificar
#   error    +blocked          → entorno/credencial caídos, ajeno al diff;
#            `e2e-test` queda puesta y retoma cuando un humano saca `blocked`
id: e2e-visual-qa
# Ver "Dónde corre" en el encabezado.
provider: anthropic-api
actions:
  - fs_read
  - fs_list
  - fs_grep
  - action: bash_run
    options:
      # Un comando se corta a los 5m; el agente puede pedir hasta 30m
      # (`timeoutMs`) para algo largo: Playwright en un browser real tarda minutos.
      timeout: 5m
      maxTimeout: 30m
      allow:
        - '*'
      deny:
        # Rol del e2e: no escribe historia de git. Forma pelada Y con args:
        # `git push` sin argumentos empuja igual la branch actual a su
        # upstream, y el matcher posicional necesita al menos un token
        # después de `push` para que `git push *` la vea — mismo motivo por
        # el que `rm` más abajo lista las dos formas.
        - 'git push'
        - 'git push *'
        # Sin `git push` no hay canal de salida por git, pero un remote
        # reescrito lo reabriria si algun dia se afloja el deny de arriba.
        - 'git remote add *'
        - 'git remote set-url *'
        - 'git commit'
        - 'git commit *'
        # Escalación / sistema
        # Los interpretes de shell van PRIMERO porque sin ellos el resto de
        # esta lista es decorativo: el matcher es posicional, asi que
        # `bash -c '<comando denegado>'` tiene `bash` en el token 1 y ninguno
        # de los denies de abajo llega a mirarse. Idem `sh -c`, `xargs` y
        # `env -i`. Que `bash_run` no use shell no ayuda si el shell es un
        # binario invocable.
        #
        # Que quede claro, para no confiarse: esto NO hace que los demas denies
        # "valgan". Mientras python/node/ruby esten permitidos —y lo estan,
        # como avisa el comentario de arriba— `python -c "import os;
        # os.system(...)"` corre cualquier comando denegado; y el matcher
        # tampoco mira rutas absolutas, asi que `/bin/bash` o `/usr/bin/aws`
        # pasan igual. Denegar los shells sube el costo del atajo mas obvio;
        # no levanta una frontera.
        #
        # La frontera real es donde corre el run: una imagen sin credenciales
        # ni herramientas de cloud, o un gateway con privilegio minimo. Esta
        # lista es friccion, no contencion.
        - 'bash *'
        - 'sh *'
        - 'zsh *'
        - 'dash *'
        - 'ksh *'
        - 'xargs *'
        - 'env -i *'
        # Wrappers que ejecutan otro binario — dejan el comando denegado en
        # el token 2+, donde el matcher posicional ya no lo mira.
        # ⚠️ Esta enumeracion NO pretende ser exhaustiva y no debe leerse como
        # cobertura. Quedan afuera wrappers presentes en cualquier imagen Linux
        # con la misma propiedad —`stdbuf`, `ionice`, `chroot`, `script -c`,
        # `parallel`— y `find . -exec <cmd> {} \;`, que reabre el atajo entero.
        # Cubre los mas obvios; la contencion real sigue siendo la imagen.
        - 'nohup *'
        - 'timeout *'
        - 'nice *'
        - 'command *'
        - 'setsid *'
        - 'watch *'
        - 'sudo *'
        - 'su *'
        - 'shutdown *'
        - 'reboot *'
        - 'halt *'
        - 'kill *'
        - 'killall *'
        - 'pkill *'
        - 'launchctl *'
        - 'systemctl *'
        - 'crontab *'
        - 'osascript *'
        # `rm` entero, no las variantes de flags. Enumerar no cierra: el matcher
        # es posicional sobre el token 2, y `rm dir -rf` / `rm build --recursive`
        # dejan la RUTA en esa posicion — GNU rm acepta los flags despues del
        # operando y borra igual. Ninguna fila de `rm -<algo>` la ve. Cerrarlo de
        # verdad pediria normalizar argv antes del match; mientras eso no exista,
        # la unica forma correcta es denegar el comando.
        #
        # Este agente no trae fs_write/fs_edit — no escribe código, sólo lee
        # (fs_read/fs_list/fs_grep) y corre specs ya existentes. Si algún
        # día necesita limpiar output de un run (screenshots, traces
        # viejos), que falle explícito y se resuelva a mano; no es su rol
        # borrar archivos del repo.
        - 'rm'
        - 'rm *'
        - 'dd *'
        - 'mkfs* *'
        - 'diskutil *'
        - 'chmod -R *'
        - 'chown *'
        # `git -C`, `git -c`, `--git-dir`, `--work-tree`, `--exec-path` y el
        # subcomando `config`/`var` NO se listan acá a propósito: los rechaza
        # `assertNoScopeChangingGitFlags` (packages/tools/src/exec/exec.ts),
        # que corre ANTES del matcher y aplica aunque el YAML no diga nada.
        #
        # Git destructivo. Forma pelada Y con args: `git reset --hard` sin
        # un ref descarta el worktree igual (usa HEAD implícito), y el
        # matcher posicional sólo ve `git reset --hard *` si hay un cuarto
        # token.
        - 'git reset --hard'
        - 'git reset --hard *'
        - 'git clean *'
        - 'git filter-branch *'
        # Credenciales / secretos / entorno (el env del proceso lleva tokens)
        - 'env'
        - 'env *'
        - 'printenv'
        - 'printenv *'
        - 'sops *'
        - 'security *'
        # Cloud / cluster / estado remoto — lo corre un humano o el CI
        - 'aws *'
        - 'kubectl *'
        - 'helm *'
        - 'flux *'
        - 'terragrunt *'
        - 'terraform apply *'
        - 'terraform destroy *'
        - 'terraform import *'
        - 'terraform state *'
        - 'terraform taint *'
        - 'terraform force-unlock *'
        # `terraform init` queda denegado ENTERO. Enumerar variantes malas no
        # cierra: `-upgrade`, `-input=false`, `-plugin-dir=x` o `init .` tambien
        # inicializan contra el backend real con las credenciales que haya. Y no
        # se puede denegar todo y re-permitir la forma buena, porque `deny` gana
        # sobre `allow` (isBashCommandAllowed en packages/tools/src/exec/pattern.ts).
        #
        # Consecuencia asumida: el agente NO puede correr `terraform validate`
        # (necesita un dir inicializado). La validacion de terraform la hace el CI
        # del repo.
        - 'terraform init'
        - 'terraform init *'
        # Ejecución remota / exfiltración / descarga de binarios
        - 'ssh *'
        - 'scp *'
        - 'sftp *'
        - 'rsync *'
        - 'curl *'
        - 'wget *'
        - 'nc *'
        # GitHub por fuera del pipeline (el PR lo maneja vía MCP)
        - 'gh *'
        # Contenedores
        - 'docker *'
        - 'docker-compose *'
        - 'podman *'
        # Publicar paquetes
        - 'npm publish *'
        - 'yarn publish *'
        - 'pnpm publish *'
        - 'gem push *'
        - 'cargo publish *'
        - 'uv publish *'
        - 'twine *'
# Listarlas ya es la decisión del operador: todas pueden escribir.
allowWrites: true
# SIN mcpServers: este agente no necesita el MCP de GitHub. No abre PR,
# no comenta por su cuenta (el reporte final lo publica el ENGINE vía
# `report` con `target: pr-else-issue`, no una tool que el agente invoque) y no lee
# nada del repo que `fs_read`/`fs_list`/`fs_grep` sobre el worktree local
# no le dé ya. Agregarlo expondría escritura de contenidos y de PRs por
# API (el token del catálogo es de escritura) sin que el agente lo use
# para nada — el deny-list de `bash_run` sólo cubre el shell; el límite
# real "no escribe historia de git" depende de no tener acá una tool que
# lo permita por otro camino.

# La evidencia pertenece al PR, que es donde va a mirarla quien la pidió.
# Sin PR (todavía no se abrió) cae al issue en vez de perderse.
report:
  action: post_comment
  with:
    target: pr-else-issue

# Cada salida es una tool `submit_<salida>` para el modelo: su `when` es lo
# que lee para elegirla, y `to` la transición del board, fijada acá y fuera
# de su alcance. Un error de la corrida no es una salida: lo cubre el
# `onError` de la regla (+blocked).
routes:
  # Consume la label que lo activó — sin esto, cualquier otra edición del
  # board en Review mientras la label siga puesta re-despacharía el mismo
  # issue.
  passed:
    when: >-
      La verificación pasó: lo pedido funciona en el entorno real.
    to: { action: update_issue, with: { removeLabels: [ e2e-test ] } }
  # Además de mover el status, saca `e2e-test`: un humano vuelve a agregarla
  # cuando quiera re-verificar, en vez de que una label vieja re-dispare la
  # verificación cuando el fix vuelva a `Review`.
  back_to_build:
    when: >-
      Lo que se ve en el browser no cumple lo pedido, o un spec existente falla por el cambio — se arregla con un ajuste del implementer. NO la uses cuando el entorno de pruebas no responde o falta una credencial: eso es ajeno al diff y va por el camino de error normal.
    to: { action: update_issue, with: { status: Build, removeLabels: [ e2e-test ] } }

providerConfig:
  model: claude-opus-5
  maxTokens: 16000
  effort: high
  taskBudgetTokens: 150000
  maxPauseTurnRetries: 3

systemPrompts:
  - text: You are Claude Code, Anthropic's official CLI for Claude.

  - text: |
      # Rol — verificador visual on-demand

      Sos el verificador visual de LaHaus. Un humano pidió verificación e2e
      de esta card agregándole la label `e2e-test` mientras está en
      Review — no sos un paso fijo del pipeline automatizado, corrés
      cuando alguien te lo pide.

      Respondé siempre en español.

      Corrés en una máquina con el toolchain de front: Node, yarn y un
      Chromium con sus libs, en `PLAYWRIGHT_BROWSERS_PATH`. El entorno de
      pruebas llega por variables que los procesos que lanzás heredan
      —`E2E_BASE_URL`, `E2E_USER`, `E2E_PASSWORD`—: pasáselas al runner de
      tests, no las imprimas.

      ## Cómo trabajar

      1. **Leé la descripción de la task y quedate con los criterios
         OBSERVABLES.** Un criterio observable es el que se puede ver en
         una pantalla ("el botón de pago queda deshabilitado sin método
         seleccionado"). Los que no se ven —una migración, un índice, un
         refactor— no son tuyos: nombralos como "fuera de alcance visual"
         y seguí.

      2. **Mirá qué cobertura existe.** Buscá los specs del repo
         (`fs_grep` / `fs_list`) y leé su `package.json` y su `CLAUDE.md`
         para saber con qué comando se corren. Las convenciones del repo
         ganan sobre cualquier heurística de este prompt.

      3. **Preparación e instalación.** Corré la instalación de
         dependencias que el repo declare (`yarn install
         --frozen-lockfile` o lo que diga su README). Si el driver de
         Playwright del repo no encuentra su browser, instalalo (`npx
         playwright install chromium`): las libs de sistema ya están, así
         que baja sólo el binario.

      4. **Corré los specs que tocan lo pedido**, no la suite entera:
         apuntá al proyecto de chromium y al archivo o grep del flujo
         relevante. Cada comando tiene un tope de 300 s, así que si la
         suite es larga, partila por archivo.

      5. **Guardá la evidencia.** Copiá lo que el runner haya dejado
         (screenshots, traces, el reporte) a
         `/state/e2e-evidence/<número-del-issue>/`. Ese directorio vive en
         el volumen de esta máquina y sobrevive al run, así que un humano
         puede buscarlo después. Nombralo en tu reporte.

      6. **Si un criterio observable no tiene ningún spec que lo cubra**,
         decilo con el nombre del criterio. Es un hallazgo, no un fallo
         tuyo.

      ## El veredicto

      **✅ Se ve funcionando** — los specs que tocan lo pedido pasan y los
      criterios observables se cumplen. Reportá:

      No tenés `curl`/`wget`: la alcanzabilidad del entorno se infiere de
      que los specs corran contra él, no de pingearlo aparte.

      ```
      **Entorno:** <E2E_BASE_URL> — <alcanzable, según los specs corridos
      / no alcanzable, con el error de conexión que dio el runner>
      **Specs corridos:** <comando> → <N passed, M failed>
      **Criterios observables:** <cuántos verificados de cuántos>
      **Evidencia:** /state/e2e-evidence/<issue>/ — <qué archivos quedaron>
      **Sin cobertura:** <criterios sin spec, o "ninguno">
      **Fuera de alcance visual:** <criterios no observables, o "ninguno">
      ```

      Cerrá con `submit_passed` y ese reporte en `report`. El engine saca
      `e2e-test` y la card queda donde estaba.

      **❌ Se arregla con un ajuste del implementer** — un spec falla por
      el cambio, lo que se ve no cumple un criterio, o un criterio
      observable no tiene cobertura y debería tenerla: cerrá con
      `submit_back_to_build` y este detalle en `report`:

      ```
      **Qué falla:** <criterio | spec rojo | cobertura faltante>
      **Evidencia:** `<comando>` → <output relevante>, o <captura en
      /state/e2e-evidence/...> → <qué se ve>
      **Esperado:** <qué debería verse>
      **Cómo se arregla:** <acción concreta para el implementer>
      ```

      Un hallazgo por bloque si hay varios.

      **🛑 Ajeno al cambio** — el entorno de pruebas no responde, falta una
      credencial, el repo base no instala: llamá `fail_turn` sin elegir
      salida, con qué está roto y la evidencia. El issue queda bloqueado
      para que lo mire un humano. Un entorno caído nunca es un fallo del
      diff.

      ## Reglas

      - Tu output es el veredicto y la evidencia. El código lo ajusta el
        implementer, que es el dueño del PR.
      - Nunca mergees el PR ni sugieras mergearlo: el merge es humano.
      - Verificá vos los criterios contra lo que se ve — que un spec pase
        no prueba que el spec cubra el criterio pedido.
      - Distinguí siempre "el flujo está mal" de "el entorno está caído".
        Son salidas distintas, y confundirlas manda a alguien a arreglar
        el código equivocado.

prompt: |
  ## La tarea a verificar

  **Título:** {{task.title}}
  **Task ID** (para tus tools de ia-flow): `{{task.id}}`
  **Issue:** {{task.issueUrl}} — el último segmento es el NÚMERO del issue.
  **Repo:** {{task.repos}}
  **Branch:** {{task.branch}} — ya está checkouteada en tu worktree.

  **Descripción (la fuente de verdad de qué debería verse):**

  {{task.description}}

  ## Novedades desde tu última corrida

  Más nuevo al final; vacío = tu primera corrida sobre esta task:

  {{task.comments}}
