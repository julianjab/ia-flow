# Gate barato antes de despertar al agente caro (refiner/implementer/reviewer)
# por un comentario humano. Sólo clasifica — no toca código, no toca el
# board, no mueve status ni labels.
#
# ── Por qué reacciona en vez de comentar ───────────────────────────────────
#
# El engine postea un auto-comment de cierre por cada run (ver `comment` en
# ia-flow/packages/shared/src/schemas.ts). Para un clasificador eso es ruido
# puro: un comentario de sistema ("procesado") por cada comentario humano,
# sin ningún hallazgo adentro — el hallazgo real, si lo hay, lo va a postear
# el agente destino (`frontend-refiner`/`refiner`/`functional-refiner`, ver
# `rules/10-refine.yaml` y afines). `report: null` apaga ese auto-comment, y
# `react_to_comment` (tool nueva en ia-flow) deja una reacción sobre el
# comentario que disparó el triage — 👍 si lo tomó en cuenta, 👎 si lo evaluó
# y no aplica. El node id del comentario viaja en el brief
# (`{{event.payload.commentId}}`, ver cada regla que despacha este agente).
#
# ── Por qué dos salidas y no una label ─────────────────────────────────────
#
# La primera versión de esto usaba una label (`+comment-actionable`) como
# señal para una segunda regla, con un `onStart` en cada agente destino para
# limpiarla. Funciona, pero es un canal de un solo bit escrito en un lugar
# (GitHub) que no es dueño del dato, y necesita que TRES agentes recuerden
# barrerla.
#
# Con dos salidas (`actionable` / `not_actionable`) el veredicto ES el ruteo
# del engine: la regla pone `routes.comment-triage.actionable.to: <agente>` y
# `submit_actionable` entrega el `input` de ese agente (el `summary` del
# pedido) en la misma llamada. Sin board, sin limpieza, sin un evento
# intermedio.
#
# ── Por qué NO usa `run_agent` para delegar directo ────────────────────────
#
# `run_agent` (packages/tools/src/agent/run-agent.ts en ia-flow) deja al
# padre bloqueado esperando la respuesta del hijo, reteniendo su lock y su
# worktree — el propio comentario de esa tool dice que es para "hijos de
# segundos a minutos". Un implementer construyendo un PRD completo, o un
# e2e-visual-qa/e2e-backend-qa corriendo en su agent-host remoto, no entran
# en esa categoría.
#
# ── Por qué el destino no sale de acá ──────────────────────────────────────
#
# Este agente no sabe en qué columna ni de qué tipo es la tarea — eso lo
# decide la REGLA que lo despacha, una por cada combinación (status ×
# task_type) que necesita un destino distinto (`rules/10-refine.yaml` y
# afines). Por eso `actionable` no declara `to`: cada regla se lo pone.
id: comment-triage
provider: anthropic-api
providerConfig:
  model: claude-haiku-4-5
  # `adaptive` (el thinking default del provider, ver
  # DEFAULT_ANTHROPIC_SETTINGS) no está soportado en claude-haiku-4-5 — la
  # API responde 400 "adaptive thinking is not supported on this model".
  # `thinkingBudgetTokens` fuerza el modo `enabled` de presupuesto fijo en
  # su lugar (ver el comentario en anthropic-api/provider.ts).
  thinkingBudgetTokens: 4096
  # Mismo motivo que en el roster de refine/review: sin esto, un pause_turn
  # se trata como fallo definitivo en el primer intento.
  maxPauseTurnRetries: 5

# Sin tools de escritura ni de repo, salvo la reacción: no implementa nada,
# no toca código ni board — sólo decide y acusa recibo.
actions:
  - react_to_comment
# Listarlas ya es la decisión del operador: todas pueden escribir.
allowWrites: true

# Sin reporte de cierre: la reacción es el único acuse de recibo — ver el
# comentario de arriba.
report: null

# Dos salidas y ningún destino propio: a qué agente lleva `actionable` lo
# decide cada regla (`routes.comment-triage.actionable.to`), porque sólo la
# regla sabe en qué columna y de qué tipo es la tarea. Lo que el triage le
# pasa al destino es el `input` de ESE agente (el `summary` del pedido).
routes:
  actionable:
    when: >-
      El comentario pide un cambio de código, de PRD o de comportamiento que un agente de refinamiento o de implementación tenga que actuar.
  not_actionable:
    when: >-
      El comentario no pide ningún cambio: pregunta, agradecimiento, aclaración de producto sin acción, o feedback ya resuelto.
    to: end

prompt: |
  Clasificá el comentario que te describe el brief de esta corrida.

  1. Llamá a `react_to_comment` sobre el `comment id` que te dio el brief:
     `+1` si el comentario es accionable, `-1` si no lo es.
  2. Cerrá con `submit_actionable` —con el pedido resumido en `summary`,
     para el agente que lo va a atender— o con `submit_not_actionable`.

  Las dos llamadas son obligatorias — la reacción es tu único acuse de
  recibo visible para el humano que comentó, y la salida que elegís es lo
  que despacha (o no) al agente destino. No hace falta nada más de tu parte.

systemPrompts:
  - text: |
      Sos un clasificador, no un implementador. Te llega UN comentario
      humano de un issue o PR del pipeline de desarrollo. Tu único trabajo
      es decidir si ese comentario pide un cambio real — algo que un
      agente de refinamiento o de implementación tenga que actuar— o si es
      otra cosa: una pregunta, un agradecimiento, una aclaración de
      producto sin acción, o feedback que ya está resuelto en el código
      actual.

      No implementes nada. No leas el repo. No escribas código. Tu salida
      son dos llamadas: `react_to_comment` con el `comment_node_id` del
      brief y `+1`/`-1` según tu veredicto, y `submit_actionable` (con el
      `summary`) o `submit_not_actionable`. No dejes ningún comentario de
      texto — la reacción y la salida son todo lo que te corresponde
      publicar.
