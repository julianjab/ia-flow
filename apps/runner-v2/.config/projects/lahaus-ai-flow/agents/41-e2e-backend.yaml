# Verificación e2e on-demand para `subscriptions` — smoke test de endpoints
# reales contra staging. Hermano de `40-e2e.yaml` (verificador visual de
# frontend), NO un fork por gusto: mismo ciclo, mismo motivo de existir
# (`e2e-test` es un pedido de un humano, no un paso del pipeline), pero un
# rol de verificación distinto porque no hay browser que mirar.
#
# ── Activación (ver pipelines/35-e2e.yaml) ─────────────────────────────────
#
# Igual que el frontend: sólo dispara en Review, la única columna donde
# `{{task.branch}}` está garantizada (branch pusheada + PR abierto). Ver el
# porqué completo en `pipelines/35-e2e.yaml` — aplica idéntico acá.
#
# ── Dónde corre ─────────────────────────────────────────────────────────
#
# Contra la Messages API, con `fs_*` y `bash_run` sobre WORKSPACE_DIR (uv +
# Python 3.12). En ia-flow corría en un agent-host remoto; este runner no
# tiene agent-hosts.
#
# El runner tiene que tener red de salida hacia staging
# (`E2E_API_BASE_URL`): sin ella, un timeout se disfrazaría de "entorno
# caído" o, peor, el veredicto correría contra nada. Si staging no responde,
# el camino es `fail_turn` (ajeno al cambio), nunca `submit_passed`.
#
# ── Por qué NO reusa specs pytest existentes ────────────────────────────────
#
# A diferencia de Playwright (donde correr los specs existentes ES la
# verificación visual), acá el pedido es un SMOKE TEST de endpoints reales
# — HTTP directo contra `E2E_API_BASE_URL`, no la suite de pytest del
# módulo (esa la corre el implementer/reviewer contra su propio entorno de
# test, no contra staging). Este agente lee la descripción de la task,
# identifica los endpoints que el cambio tocó y les pega directo.
#
# `curl` está PERMITIDO para este agente (a diferencia de `40-e2e.yaml`,
# que lo deniega junto al resto de las herramientas de red): es la
# herramienta con la que hace su trabajo, análogo a que el Chromium del
# frontend hace requests que `bash_run` nunca ve. El resto de las
# herramientas de red/exfiltración (`ssh`, `scp`, `sftp`, `rsync`, `nc`,
# `wget`) sigue denegado — sólo se habilita el destino puntual de este rol.
#
# ── Por qué no escribe código ────────────────────────────────────────────
#
# Igual que el frontend: reporta, no arregla. Un hallazgo de smoke test
# vuelve al implementer.
#
# ── El ciclo (ver pipelines/35-e2e.yaml) ───────────────────────────────────
#
#   activa   projects_v2_item.edited + label `e2e-test` agregada, repo
#            subscriptions, sin `blocked`
#   éxito    -e2e-test         → los endpoints responden lo esperado; la
#            label se consume y la card queda donde estaba (no mueve status)
#   ajuste   back_to_build     → Status=Build, -e2e-test: hay que arreglar
#            código; un humano vuelve a agregar `e2e-test` para re-verificar
#   error    +blocked          → staging/credencial caídos, ajeno al diff;
#            `e2e-test` queda puesta y retoma cuando un humano saca `blocked`
id: e2e-backend-qa
# Ver "Dónde corre" en el encabezado.
provider: anthropic-api
actions:
  - fs_read
  - fs_list
  - fs_grep
  - action: bash_run
    options:
      # Un comando se corta a los 5m; el agente puede pedir hasta 30m
      # (`timeoutMs`) para algo largo: los smoke tests contra staging tardan minutos.
      timeout: 5m
      maxTimeout: 30m
      allow:
        - '*'
      deny:
        # Mismo criterio y misma lista base que `40-e2e.yaml` — ver sus
        # comentarios para el porqué de cada fila. Se repite entera acá (no
        # se comparte un YAML común entre agentes en este roster) salvo la
        # excepción de `curl`, documentada en el encabezado de este archivo.
        - 'git push'
        - 'git push *'
        - 'git remote add *'
        - 'git remote set-url *'
        - 'git commit'
        - 'git commit *'
        - 'bash *'
        - 'sh *'
        - 'zsh *'
        - 'dash *'
        - 'ksh *'
        - 'xargs *'
        - 'env -i *'
        - 'nohup *'
        - 'timeout *'
        - 'nice *'
        - 'command *'
        - 'setsid *'
        - 'watch *'
        - 'sudo *'
        - 'su *'
        - 'shutdown *'
        - 'reboot *'
        - 'halt *'
        - 'kill *'
        - 'killall *'
        - 'pkill *'
        - 'launchctl *'
        - 'systemctl *'
        - 'crontab *'
        - 'osascript *'
        - 'rm'
        - 'rm *'
        - 'dd *'
        - 'mkfs* *'
        - 'diskutil *'
        - 'chmod -R *'
        - 'chown *'
        - 'git reset --hard'
        - 'git reset --hard *'
        - 'git clean *'
        - 'git filter-branch *'
        - 'env'
        - 'env *'
        - 'printenv'
        - 'printenv *'
        - 'sops *'
        - 'security *'
        - 'aws *'
        - 'kubectl *'
        - 'helm *'
        - 'flux *'
        - 'terragrunt *'
        - 'terraform apply *'
        - 'terraform destroy *'
        - 'terraform import *'
        - 'terraform state *'
        - 'terraform taint *'
        - 'terraform force-unlock *'
        - 'terraform init'
        - 'terraform init *'
        # `curl`/`wget` del roster original quedan partidos: `curl` se
        # permite (ver encabezado), `wget` sigue denegado — un solo
        # cliente HTTP alcanza para el rol, y no hay motivo para abrir los
        # dos.
        - 'ssh *'
        - 'scp *'
        - 'sftp *'
        - 'rsync *'
        - 'wget *'
        - 'nc *'
        - 'gh *'
        - 'docker *'
        - 'docker-compose *'
        - 'podman *'
        - 'npm publish *'
        - 'yarn publish *'
        - 'pnpm publish *'
        - 'gem push *'
        - 'cargo publish *'
        - 'uv publish *'
        - 'twine *'
# Listarlas ya es la decisión del operador: todas pueden escribir.
allowWrites: true
# SIN mcpServers — mismo motivo que `40-e2e.yaml`: no abre PR, no
# comenta por su cuenta (el reporte lo publica el ENGINE vía
# `report` con `target: pr-else-issue`) y `fs_read`/`fs_list`/`fs_grep` alcanzan para
# leer el repo. Agregarlo expondría escritura de PRs por API sin uso.

# La evidencia pertenece al PR, que es donde va a mirarla quien la pidió.
# Sin PR (todavía no se abrió) cae al issue en vez de perderse.
report:
  action: post_comment
  with:
    target: pr-else-issue

# Cada salida es una tool `submit_<salida>` para el modelo: su `when` es lo
# que lee para elegirla, y `to` la transición del board, fijada acá y fuera
# de su alcance. Un error de la corrida no es una salida: lo cubre el
# `onError` de la regla (+blocked).
routes:
  # Consume la label que lo activó — sin esto, cualquier otra edición del
  # board en Review mientras la label siga puesta re-despacharía el mismo
  # issue.
  passed:
    when: >-
      La verificación pasó: lo pedido funciona en el entorno real.
    to: { action: update_issue, with: { removeLabels: [ e2e-test ] } }
  # Además de mover el status, saca `e2e-test`: un humano vuelve a agregarla
  # cuando quiera re-verificar, en vez de que una label vieja re-dispare la
  # verificación cuando el fix vuelva a `Review`.
  back_to_build:
    when: >-
      Un endpoint no responde lo esperado (status, shape del body, un criterio funcional pedido) — se arregla con un ajuste del implementer. NO la uses cuando staging no responde o falta una credencial: eso es ajeno al diff y va por el camino de error normal.
    to: { action: update_issue, with: { status: Build, removeLabels: [ e2e-test ] } }

providerConfig:
  model: claude-opus-5
  maxTokens: 16000
  effort: high
  taskBudgetTokens: 150000
  maxPauseTurnRetries: 3

systemPrompts:
  - text: You are Claude Code, Anthropic's official CLI for Claude.

  - text: |
      # Rol — smoke tester de endpoints on-demand

      Sos el verificador e2e de `subscriptions` (backend Python
      FastAPI, LaHaus). Un humano pidió verificación e2e de esta card
      agregándole la label `e2e-test` mientras está en Review — no sos
      un paso fijo del pipeline automatizado, corrés cuando alguien te
      lo pide.

      Respondé siempre en español.

      Corrés en una máquina con Python 3.12 y `uv`. El ambiente de
      staging llega por variables que ya tenés en tu entorno —
      `E2E_API_BASE_URL`, `E2E_API_TOKEN`—: pasalas en los headers de
      tus requests, no las imprimas.

      ## Cómo trabajar

      1. **Leé la descripción de la task y quedate con los criterios
         OBSERVABLES vía HTTP.** Un criterio observable es el que se
         puede confirmar con una request real ("el endpoint POST
         /subscriptions devuelve 201 y el body trae `status: active`").
         Los que no se ven en la respuesta HTTP —una migración, un
         índice, un job async sin endpoint de estado— no son tuyos:
         nombralos como "fuera de alcance del smoke test" y seguí.

      2. **Identificá los endpoints que el cambio tocó.** Leé el diff
         (`fs_grep`/`fs_read` sobre las rutas del módulo tocado —
         `core/`, `app/subscriptions/`, `app/client-api/`, `app/ads/`,
         según lo que declare `{{task.repos}}`) para saber el path, el
         método y el shape esperado del request/response. Las
         convenciones del módulo (su `CLAUDE.md`, su `pyproject.toml`)
         ganan sobre cualquier heurística de este prompt.

      3. **Pegale al endpoint real con `curl`** contra
         `$E2E_API_BASE_URL`, con el bearer `$E2E_API_TOKEN` en el
         header `Authorization`. Un request por criterio observable;
         no hace falta orquestar un flujo completo si el criterio es
         puntual.

      4. **Guardá la evidencia.** Copiá el request+response completo
         (status, headers relevantes, body) en tu reporte — no hace
         falta un archivo aparte como en el frontend, la respuesta HTTP
         ES la evidencia.

      5. **Si un criterio observable no se puede confirmar por HTTP**
         (necesita inspeccionar un job async, un side-effect en otro
         servicio), decilo con el nombre del criterio. Es un hallazgo,
         no un fallo tuyo.

      ## El veredicto

      **✅ Responde lo esperado** — los endpoints tocados devuelven el
      status y el shape pedidos. Reportá:

      ```
      **Entorno:** <E2E_API_BASE_URL> — <alcanzable / no alcanzable, con
      el error de conexión que dio curl>
      **Requests hechos:** <método path> → <status> (uno por línea)
      **Criterios observables:** <cuántos verificados de cuántos>
      **Sin cobertura HTTP:** <criterios sin endpoint que los exponga, o
      "ninguno">
      ```

      Cerrá con `submit_passed` y ese reporte en `report`. El engine saca
      `e2e-test` y la card queda donde estaba.

      **❌ Se arregla con un ajuste del implementer** — un endpoint
      devuelve el status o el body equivocado, o un criterio observable
      no tiene ningún endpoint que lo exponga y debería tenerlo: cerrá con
      `submit_back_to_build` y este detalle en `report`:

      ```
      **Qué falla:** <criterio | endpoint> — <método path>
      **Evidencia:** <status/body recibido> vs <status/body esperado>
      **Esperado:** <qué debería devolver>
      **Cómo se arregla:** <acción concreta para el implementer>
      ```

      Un hallazgo por bloque si hay varios.

      **🛑 Ajeno al cambio** — staging no responde, falta una
      credencial, `E2E_API_BASE_URL`/`E2E_API_TOKEN` no están seteadas:
      llamá `fail_turn` sin elegir salida, con qué está roto y la
      evidencia. El issue queda bloqueado para que lo mire un humano.
      Un entorno caído nunca es un fallo del diff.

      ## Reglas

      - Tu output es el veredicto y la evidencia. El código lo ajusta
        el implementer, que es el dueño del PR.
      - Nunca mergees el PR ni sugieras mergearlo: el merge es humano.
      - Verificá vos la respuesta contra el criterio pedido — un 200 no
        prueba que el body tenga el shape correcto.
      - Distinguí siempre "el endpoint está mal" de "staging está
        caído". Son salidas distintas, y confundirlas manda a alguien a
        arreglar el código equivocado.

prompt: |
  ## La tarea a verificar

  **Título:** {{task.title}}
  **Task ID** (para tus tools de ia-flow): `{{task.id}}`
  **Issue:** {{task.issueUrl}} — el último segmento es el NÚMERO del issue.
  **Repo:** {{task.repos}}
  **Branch:** {{task.branch}} — ya está checkouteada en tu worktree.

  **Descripción (la fuente de verdad de qué debería responder):**

  {{task.description}}

  ## Novedades desde tu última corrida

  Más nuevo al final; vacío = tu primera corrida sobre esta task:

  {{task.comments}}
