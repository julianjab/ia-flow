# Variante del implementer (`20-implementer.yaml`) para el repo frontend con
# flujo de Figma. Fork intencional, no una extensión — mismo motivo que
# `12-frontend-refiner.yaml` sobre `10-refiner.yaml`: los YAML anchors no
# cruzan archivos (ver ia-flow-agent-authoring skill), así que compartir el
# método entre los dos exige o bien duplicar, o bien mover TODO el prompt a
# `systemPrompts` a nivel de PROYECTO (afecta también al refiner y al
# reviewer, que no lo necesitan) — duplicar acá es el costo más chico de los
# dos mientras haya un solo repo frontend en el pipeline.
#
# Único diff real contra `implementer`: `mcpServers` suma `figma-mcp` y el
# prompt agrega dos bloques — leer el Figma linkeado ANTES de escribir código
# (mismo criterio que `frontend-refiner`) y RELEERLO después de implementar
# para validar el resultado contra el diseño, antes de pushear. El resto —
# tools, política de bash_run, routes, cierre — es idéntico a `implementer`;
# si diverge más allá de eso, es la señal de reevaluar el fork (ver la nota
# de `12-frontend-refiner.yaml`).
#
# Activación en `pipelines/20-build-arrival.yaml` y `21-build-reentry.yaml`:
# su paso (`when: item.repos contains lh-seller-v2-frontend`) va ANTES que el
# del `implementer` genérico y las pipelines son `firstMatch` — así una tarea
# de este repo nunca llega al `implementer` genérico, y viceversa.
#
# Usa `figma-mcp` (runner.yaml): sin FIGMA_MCP_TOKEN, o si no responde al
# arrancar, el runner lo omite con un aviso y el agente corre sin Figma.
id: frontend-implementer
# Mismo provider que `implementer` (`20-implementer.yaml`).
# Dónde corre, en orden: una sesión del CLI en tmux si tiene lugar (se mira con
# `tmux attach`), si no la API. Cada uno con su config; al retomar una espera o
# un reinicio sigue en el que empezó.
# Primero un host suscrito que la tome (`remote:*`: una máquina que presta su
# `claude`, en orden de suscripción, si sus condiciones la aceptan); si no hay o
# están llenos, el claude de este runner; y la API como último respaldo.
providers:
  - id: remote:*
    config: { model: opus }
  - id: claude-tmux
    config: { model: opus }
  - id: anthropic-api
    config: { model: claude-opus-5 }
# Lo que le pueden inyectar mientras corre: lo lee en su próxima vuelta en
# vez de que el evento espere a que termine y lo relance. Es TODO el filtro
# (las reglas no se evalúan para un evento inyectado): por eso excluye acá
# también lo que publica el propio engine (`<!-- ia-flow: -->`).
injects:
  - on: [ issue_comment ]
    when:
      - { field: action, op: eq, value: created }
      - { field: body, op: matches, value: '^(?![\s\S]*<!-- ia-flow:)' }
  # Un review que pide cambios mientras todavía trabaja en la tarea.
  - on: [ pull_request_review ]
    when:
      - { field: action, op: eq, value: submitted }
      - { field: state, op: eq, value: changes_requested }
actions:
  - reply_pr_review_thread
  - resolve_pr_review_thread
  - create_github_issue
  # Contesta en el hilo de Slack del pedido de review cuando el cambio lo pidieron por ahí
  # (`{{replyInstructions}}` de `50-comment.yaml`); un comentario de GitHub no la usa.
  - slack_post_message
  - add_to_project
  - mark_blocked_by
  - list_sub_issues_brief
  - fs_read
  - fs_list
  - fs_grep
  - fs_write
  - fs_edit
  # `githubAuth`: mismo criterio que `implementer` (ver `20-implementer.yaml`).
  - action: bash_run
    options:
      # Un comando se corta a los 2m; el agente puede pedir hasta 20m
      # (`timeoutMs`) para algo largo: un `yarn test`/build completo pasa el minuto.
      timeout: 2m
      maxTimeout: 20m
