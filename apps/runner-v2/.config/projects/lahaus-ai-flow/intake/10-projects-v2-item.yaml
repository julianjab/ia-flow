# Un item del board se creó o se editó. El delivery no trae el issue (un item puede venir de
# cualquier repo): se lee el item por GraphQL, y sólo si es de ESTE board sigue.
#
#   created                → issue.created          (la card entró al board)
#   edited, campo Status   → issue.status_changed   (con from/to; sin cambio real, nada)
#   edited, otro campo     → projects_v2_item.edited
#
# Un cambio de Status produce SÓLO `issue.status_changed`: las pipelines de Refine escuchan
# también `projects_v2_item.edited` y correrían dos veces.
id: intake-projects-v2-item
on: [ github.projects_v2_item ]
when:
  - { field: action, op: in, value: [ created, edited ] }
  - { field: projects_v2_item.content_type, op: eq, value: Issue }
do:
  - id: item
    http: /graphql
    connection: github
    graphql: |
      query($id: ID!) {
        node(id: $id) {
          ... on ProjectV2Item {
            project { number owner { ... on Organization { login } ... on User { login } } }
            content { ... on Issue { number repository { name owner { login } } } }
          }
        }
      }
    variables: { id: '{{projects_v2_item.node_id}}' }
    select: node

  - emit: task.resolve
    when:
      - { field: steps.item.project.number, op: eq, value: '{{vars.board.number}}' }
      - { field: steps.item.project.owner.login, op: eq, value: '{{vars.board.owner}}' }
      - { field: action, op: eq, value: created }
    payload:
      emit: issue.created
      owner: '{{steps.item.content.repository.owner.login}}'
      repo: '{{steps.item.content.repository.name}}'
      number: '{{steps.item.content.number}}'

  - emit: task.resolve
    # Sin precedencia: (to != from  ó  sin to) y el resto.
    when:
      # Re-elegir el mismo valor no es un cambio. Sin `to` (GitHub no siempre lo manda), sí:
      # `task_payload` lo completa con el status que quedó en el board.
      - { field: changes.field_value.to.name, op: neq, valueFrom: changes.field_value.from.name }
      - { field: changes.field_value.to.name, op: notExists, logic: or }
      - { field: steps.item.project.number, op: eq, value: '{{vars.board.number}}' }
      - { field: steps.item.project.owner.login, op: eq, value: '{{vars.board.owner}}' }
      - { field: action, op: eq, value: edited }
      - { field: changes.field_value.field_name, op: in, value: [ Status, status ] }
    payload:
      emit: issue.status_changed
      owner: '{{steps.item.content.repository.owner.login}}'
      repo: '{{steps.item.content.repository.name}}'
      number: '{{steps.item.content.number}}'
      status: '{{changes.field_value.to.name}}'
      extra:
        from: '{{changes.field_value.from.name}}'
        to: '{{changes.field_value.to.name}}'

  - emit: task.resolve
    when:
      - { field: steps.item.project.number, op: eq, value: '{{vars.board.number}}' }
      - { field: steps.item.project.owner.login, op: eq, value: '{{vars.board.owner}}' }
      - { field: action, op: eq, value: edited }
      - { field: changes.field_value.field_name, op: notIn, value: [ Status, status ] }
    payload:
      emit: projects_v2_item.edited
      owner: '{{steps.item.content.repository.owner.login}}'
      repo: '{{steps.item.content.repository.name}}'
      number: '{{steps.item.content.number}}'
      extra:
        action: edited
        fieldName: '{{changes.field_value.field_name}}'
