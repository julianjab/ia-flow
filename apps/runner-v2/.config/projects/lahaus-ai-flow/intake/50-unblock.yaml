# unblock-dependents: un PR mergeado destraba las tasks que su issue bloqueaba
# (`mark_blocked_by`, la dependencia nativa de GitHub). Sin esto, cerrar el prerrequisito no
# destraba nada: el gate `item.blocked` sólo se vuelve a mirar cuando llega un evento SOBRE la
# tarea bloqueada, y mergear su bloqueante no genera ninguno.
#
# Cada dependiente abierto de un repo del catálogo pasa por `resolve-task` con
# `onlyIfUnblocked`: recibe `issue.unblocked` sólo si ya no le queda ningún otro blocker
# abierto. El issue recién cerrado no cuenta: el webhook del merge puede llegar antes que su cierre.
id: intake-unblock
on: [ github.pull_request ]
when:
  - { field: action, op: eq, value: closed }
  - { field: pull_request.merged, op: eq, value: true }
  - { field: repository.full_name, op: in, value: '{{vars.repos}}' }
do:
  - id: blocker
    function: linked_issue
    with:
      head: '{{pull_request.head.ref}}'
      body: '{{pull_request.body}}'
      prefix: '{{vars.branchPrefix}}'
  - id: blocking
    http: /repos/{{repository.owner.login}}/{{repository.name}}/issues/{{steps.blocker}}/dependencies/blocking
    connection: github
    when: [ { field: steps.blocker, op: exists } ]
  - id: dependents
    function: issue_refs
    with: { issues: '{{steps.blocking}}', repos: '{{vars.repos}}' }
    when: [ { field: steps.blocker, op: exists } ]
  - emit: task.resolve
    forEach: '{{steps.dependents}}'
    when: [ { field: steps.dependents, op: exists } ]
    payload:
      emit: issue.unblocked
      owner: '{{item.owner}}'
      repo: '{{item.repo}}'
      number: '{{item.number}}'
      closedBlocker: 'https://github.com/{{repository.full_name}}/issues/{{steps.blocker}}'
      onlyIfUnblocked: true
