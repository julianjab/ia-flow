# Un PR abierto, actualizado o cerrado: la task es el issue que implementa (su rama o su
# `Closes #n`; sin ninguno, el PR mismo), con el PR aplanado en `pr.*`.
id: intake-pull-request
on: [ github.pull_request ]
when:
  - { field: repository.full_name, op: in, value: '{{vars.repos}}' }
do:
  - id: number
    function: linked_issue
    with:
      head: '{{pull_request.head.ref}}'
      body: '{{pull_request.body}}'
      prefix: '{{vars.branchPrefix}}'
      fallback: '{{pull_request.number}}'
  - emit: task.resolve
    payload:
      emit: pull_request
      owner: '{{repository.owner.login}}'
      repo: '{{repository.name}}'
      number: '{{steps.number}}'
      pr: '{{pull_request.number}}'
      extra:
        action: '{{action}}'
        pr:
          number: '{{pull_request.number}}'
          title: '{{pull_request.title}}'
          state: '{{pull_request.state}}'
          isDraft: '{{pull_request.draft}}'
          merged: '{{pull_request.merged}}'
          author: '{{pull_request.user.login}}'
          head: { ref: '{{pull_request.head.ref}}', sha: '{{pull_request.head.sha}}' }
          base: { ref: '{{pull_request.base.ref}}' }
          url: '{{pull_request.html_url}}'
