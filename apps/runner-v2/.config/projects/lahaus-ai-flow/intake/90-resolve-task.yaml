# La segunda etapa del intake: de "qué task es" a "el evento de la task".
#
# Cada webhook (los otros archivos de esta carpeta) decide a qué task se refiere y qué evento
# le toca, y publica `task.resolve`. Acá se lee de GitHub lo que el agente necesita —la card del
# board, el issue, sus blockers, el timeline del issue y del PR, el CI— y se publica el evento con
# el scope de la task: desde ahí es una ejecución más de esa task.
#
# `task.resolve` trae:
#   emit              el evento a publicar (`issue_comment`, `issue.status_changed`, …)
#   owner/repo/number la task
#   pr                el PR del evento, si trae uno
#   status            pisa el status del board (el `to` de un cambio que el board aún no refleja)
#   comment, extra    lo propio del evento (el comentario; from/to, state, conclusion, …)
#   closedBlocker     un issue recién cerrado que ya no cuenta como bloqueador
#   onlyIfUnblocked   publicar SÓLO si la task quedó sin blockers abiertos
id: intake-resolve-task
on: [ task.resolve ]
do:
  # La card en el board de este runner. Si el issue no está ahí, es de otro engine (el de
  # producción comparte los repos): nada de lo que sigue corre.
  - id: items
    http: /graphql
    connection: github
    graphql: |
      query($owner: String!, $repo: String!, $number: Int!) {
        repository(owner: $owner, name: $repo) {
          issue(number: $number) {
            projectItems(first: 50) {
              nodes {
                id
                project { number owner { ... on Organization { login } ... on User { login } } }
                fieldValues(first: 30) {
                  nodes {
                    ... on ProjectV2ItemFieldSingleSelectValue {
                      name
                      field { ... on ProjectV2SingleSelectField { name } }
                    }
                  }
                }
              }
            }
          }
        }
      }
    variables: { owner: '{{owner}}', repo: '{{repo}}', number: '{{number}}' }
    select: repository.issue.projectItems.nodes
  - id: card
    function: board_item
    with: { items: '{{steps.items}}', board: '{{vars.board}}' }

  - id: issue
    http: /repos/{{owner}}/{{repo}}/issues/{{number}}
    connection: github
    when: [ { field: steps.card, op: exists } ]
  - id: blockers
    http: /repos/{{owner}}/{{repo}}/issues/{{number}}/dependencies/blocked_by
    connection: github
    when: [ { field: steps.card, op: exists } ]
  - id: issue_comments
    http: /repos/{{owner}}/{{repo}}/issues/{{number}}/comments
    connection: github
    query: { per_page: 100 }
    when: [ { field: steps.card, op: exists } ]

  # El PR de la task: el del evento si sigue abierto, si no el abierto desde su rama.
  - id: pr_by_number
    http: /repos/{{owner}}/{{repo}}/pulls/{{pr}}
    connection: github
    when:
      - { field: steps.card, op: exists }
      - { field: pr, op: exists }
  - id: prs_by_branch
    http: /repos/{{owner}}/{{repo}}/pulls
    connection: github
    query: { state: open, head: '{{owner}}:{{vars.branchPrefix}}{{number}}' }
    when:
      - { field: steps.card, op: exists }
      - { field: pr, op: notExists }
  - id: open_pr
    function: open_pr
    with: { byNumber: '{{steps.pr_by_number}}', byBranch: '{{steps.prs_by_branch}}' }
    when: [ { field: steps.card, op: exists } ]

  # Con PR abierto: su timeline (comentarios, hilos sin resolver, reviews) y su CI.
  - id: pr_comments
    http: /repos/{{owner}}/{{repo}}/issues/{{steps.open_pr.number}}/comments
    connection: github
    query: { per_page: 100 }
    when: [ { field: steps.open_pr, op: exists } ]
  - id: threads
    http: /graphql
    connection: github
    graphql: |
      query($owner: String!, $repo: String!, $number: Int!) {
        repository(owner: $owner, name: $repo) {
          pullRequest(number: $number) {
            reviewThreads(last: 30) {
              nodes {
                id isResolved path line
                comments(first: 20) { nodes { body createdAt author { login } } }
              }
            }
          }
        }
      }
    variables: { owner: '{{owner}}', repo: '{{repo}}', number: '{{steps.open_pr.number}}' }
    select: repository.pullRequest.reviewThreads.nodes
    when: [ { field: steps.open_pr, op: exists } ]
  - id: reviews
    http: /repos/{{owner}}/{{repo}}/pulls/{{steps.open_pr.number}}/reviews
    connection: github
    query: { per_page: 100 }
    when: [ { field: steps.open_pr, op: exists } ]
  - id: checks
    http: /repos/{{owner}}/{{repo}}/commits/{{steps.open_pr.headSha}}/check-runs
    connection: github
    query: { per_page: 100 }
    select: check_runs
    when: [ { field: steps.open_pr, op: exists } ]
  - id: statuses
    http: /repos/{{owner}}/{{repo}}/commits/{{steps.open_pr.headSha}}/status
    connection: github
    select: statuses
    when: [ { field: steps.open_pr, op: exists } ]

  - id: task
    function: task_payload
    with:
      emit: '{{emit}}'
      owner: '{{owner}}'
      repo: '{{repo}}'
      number: '{{number}}'
      pr: '{{pr}}'
      status: '{{status}}'
      extra: '{{extra}}'
      comment: '{{comment}}'
      closedBlocker: '{{closedBlocker}}'
      card: '{{steps.card}}'
      issue: '{{steps.issue}}'
      blockers: '{{steps.blockers}}'
      issueComments: '{{steps.issue_comments}}'
      openPr: '{{steps.open_pr}}'
      prComments: '{{steps.pr_comments}}'
      threads: '{{steps.threads}}'
      reviews: '{{steps.reviews}}'
      checks: '{{steps.checks}}'
      statuses: '{{steps.statuses}}'
      projectId: '{{vars.projectId}}'
      branchPrefix: '{{vars.branchPrefix}}'
      repos: '{{vars.reposText}}'
    when: [ { field: steps.card, op: exists } ]

  # Publicar, salvo que el pedido sea "sólo si quedó destrabada" y todavía tenga blockers.
  - emit: '{{steps.task.type}}'
    payload: '{{steps.task.payload}}'
    scope: '{{steps.task.scope}}'
    when:
      - { field: onlyIfUnblocked, op: neq, value: true }
      - { field: steps.task.blocked, op: eq, value: false, logic: or }
      - { field: steps.task, op: exists }
