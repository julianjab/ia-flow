# Un comentario humano. Hecho en un PR, habla de la task que ese PR implementa (su rama
# `<prefijo><n>` o su `Closes #n`), no del PR como issue.
id: intake-issue-comment
on: [ github.issue_comment ]
when:
  - { field: repository.full_name, op: in, value: '{{vars.repos}}' }
do:
  - id: pr
    http: /repos/{{repository.owner.login}}/{{repository.name}}/pulls/{{issue.number}}
    connection: github
    when: [ { field: issue.pull_request, op: exists } ]
  - id: number
    function: linked_issue
    with:
      head: '{{steps.pr.head.ref}}'
      body: '{{steps.pr.body}}'
      prefix: '{{vars.branchPrefix}}'
      fallback: '{{issue.number}}'
  - emit: task.resolve
    payload:
      emit: issue_comment
      owner: '{{repository.owner.login}}'
      repo: '{{repository.name}}'
      number: '{{steps.number}}'
      pr: '{{steps.pr.number}}'
      comment: { body: '{{comment.body}}', author: '{{sender.login}}', id: '{{comment.id}}' }
      extra: { action: '{{action}}' }
