# El proyecto lahaus-ai-flow, para el runner: su board de GitHub Projects, el
# prefijo de la rama de cada task (`<prefijo><número>`) y qué cards del board
# son suyas. Sus agentes y pipelines (y sus system prompts, en source.yaml) los
# lee el engine; sólo le llegan los eventos con `scope.projectId: lahaus-ai-flow`,
# que fija `resolve_task`.
board: https://github.com/orgs/la-haus/projects/119
branchPrefix: ia-flow-local/
# Este runner y el de claw-agents escuchan el mismo board (119). El reparto es
# por la label `blocked`: el de claw-agents excluye esas cards y este toma SÓLO
# esas. Lo aplica el intake (`resolve_task` no publica nada de una card sin la
# label).
label: blocked
