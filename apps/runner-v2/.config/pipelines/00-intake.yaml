# Los webhooks de GitHub → el evento de su task (`resolve_task`, .config/actions/).
#
# La acción encuentra la task (el issue detrás de un item del board, el que implementa el PR
# de un comentario, la rama `<prefijo><n>` de un CI), la lee de GitHub —card, issue, blockers,
# comentarios, PR, CI— y publica el evento que escuchan las pipelines, con el scope de la task:
#
#   projects_v2_item      → issue.created · issue.status_changed · projects_v2_item.edited
#   issue_comment         → issue_comment
#   pull_request(_review) → pull_request · pull_request_review
#   check_suite, workflow_run (completed) → check_suite · workflow_run
#
# No publica nada para un repo fuera del catálogo, ni para una card de otro board o sin la
# `label` del proyecto (`projects/<id>/project.yaml`): esas son del engine de producción.
id: intake
on:
  - github.projects_v2_item
  - github.issue_comment
  - github.pull_request
  - github.pull_request_review
  - github.check_suite
  - github.workflow_run
do:
  - action: resolve_task
