# runner-v2 — el scope runner: lo global (identidad, providers, MCP) y el engine (`engine:`).
#
# La regla: **secreto → env; comportamiento → acá.** Este archivo se commitea:
# un token se NOMBRA (`${VAR}`) y el runner lo resuelve del ambiente al arrancar.
# El ambiente gana sobre este archivo (ver src/config/RunnerConfig.ts).

settings:
  # Puerto del servidor de webhooks (`--serve`). Env: IA_FLOW_SERVER_PORT.
  port: 3001

# Identidad de GitHub. `auto` usa la App si están los tres datos, si no
# GITHUB_TOKEN, si no `gh auth token`. `privateKeyPath` es la RUTA al PEM, fuera
# del repo (el PEM nunca se copia acá); en otra máquina la pisa
# IA_FLOW_GITHUB_APP_PRIVATE_KEY_PATH.
github:
  mode: auto
  appId: "4599112"
  installationId: "156768020"
  privateKeyPath: /Users/julianbuitrago/Downloads/julianjab_github_app.private-key.pem

# Los defaults de cada provider para TODOS sus agentes; el `providerConfig` de un
# agente los pisa clave por clave. Los valida el provider al arrancar.
providers:
  anthropic-api:
    maxTokens: 32000
    maxToolRounds: 200
    maxPauseTurnRetries: 5

# Los MCP que los agentes nombran en `mcpServers`. Uno que no responde al
# arrancar se omite con un aviso: Anthropic rechaza la request entera si un
# `mcp_servers` está caído, y eso tumbaría a todos los agentes que lo usan.
# `${GITHUB_TOKEN}` es SIEMPRE el installation token de la App.
mcp:
  - id: github-mcp
    config:
      type: http
      url: https://api.githubcopilot.com/mcp/
      authorizationToken: ${GITHUB_TOKEN}
  - id: figma-mcp
    config:
      type: http
      url: https://ia-flow-hooks.ss.lahaus.com/mcp/figma
      authorizationToken: ${FIGMA_MCP_TOKEN}

# El engine: cómo lo arma el runner (src/engine/mountEngine.ts).
# Las rutas son relativas a este archivo. Las fuentes no van acá: las monta el
# runner — la global (esta carpeta: pipelines/ y agents/) y una por proyecto
# (projects/<id>/), que sólo recibe los eventos con su `scope.projectId`.
engine:
  # Tope de la cadena de eventos derivados (un paso que emite otro evento).
  maxEventDepth: 10

  # Cada corrida con agentes es una EJECUCIÓN de su task: una task nunca corre
  # dos a la vez, y las pausas (esperar el CI) sobreviven a un reinicio porque
  # viven en SQLite. `bun-sqlite` lo registra el runner (src/storage/).
  executions:
    driver: bun-sqlite
    path: ../.state/executions.sqlite
    # Cuántas corridas en paralelo, entre todas las tasks.
    maxConcurrent: 1

  # Cada cuánto se revisan las pausas vencidas (`timeout` de un `pause`).
  tick:
    everyMs: 60000

  # El clasificador de los `whenText` (pipelines y pasos): Haiku por la Messages
  # API de Anthropic, con la misma ANTHROPIC_API_KEY que los agentes. Sin la
  # key, lo que tiene un `whenText` no corre.
  whenText:
    model: claude-haiku-4-5

  # Cómo le llega a un agente que ya corre un evento que acepta (`injects`): el
  # texto que arma `resolve_task` en `payload.message`.
  formatMessage: '{{message}}'

# Qué corre: la composición del runner (el engine sólo ve fuentes ya armadas).
# Cada lista acepta, sola o en lista, un directorio, un archivo, un glob en el
# nombre (`./pipelines/0*.yaml`) o el documento inline; las rutas son relativas
# a este archivo. Editar estas listas recarga las fuentes sin reiniciar.
sources:
  # La fuente global: recibe todos los eventos. Son los webhooks crudos de
  # GitHub (`github.<evento>`) → el evento de su task, con `resolve_task`
  # (.config/actions/): encuentra la task (el issue detrás de un item del board,
  # el que implementa el PR de un comentario, la rama `<prefijo><n>` de un CI),
  # decide de qué proyecto es, la lee de GitHub —card, issue, blockers,
  # comentarios, PR, CI— y publica el evento de la task con su scope:
  #
  #   projects_v2_item      → issue.created · issue.status_changed · projects_v2_item.edited
  #   issue_comment         → issue_comment
  #   pull_request(_review) → pull_request · pull_request_review
  #   check_suite, workflow_run (completed) → check_suite · workflow_run
  #
  # No publica nada para un repo fuera del catálogo, ni para una card de otro
  # board o sin la `label` del proyecto (project.yaml): esas son del engine de
  # producción.
  pipelines:
    - id: intake
      on:
        - github.projects_v2_item
        - github.issue_comment
        - github.pull_request
        - github.pull_request_review
        - github.check_suite
        - github.workflow_run
      do:
        - action: resolve_task

    # Un PR mergeado destraba las tasks que su issue bloqueaba (`mark_blocked_by`):
    # cada una que quedó sin otro blocker abierto recibe `issue.unblocked`, y la
    # pipeline de reentrada de su columna la retoma.
    - id: intake-unblock
      on: [github.pull_request]
      when:
        - { field: action, op: eq, value: closed }
        - { field: pull_request.merged, op: eq, value: true }
      do:
        - action: resolve_task
          with: { unblockDependents: true }

  # Las actions globales (código: sólo rutas). Las ve toda fuente; las de un
  # proyecto van en su project.yaml y ganan sobre éstas. Un directorio toma sus
  # `*.ts` directos (no `_lib/`, ni tests).
  actions: ./actions

  # Cada proyecto: la ruta a su project.yaml, o el proyecto inline. Su fuente
  # sólo recibe los eventos con su `scope.projectId` (los que publica
  # `resolve_task`).
  projects:
    lahaus-ai-flow: ./projects/lahaus-ai-flow/project.yaml
