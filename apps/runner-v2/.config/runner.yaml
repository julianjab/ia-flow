# runner-v2 — el scope runner: lo global (identidad, providers, MCP) y el engine (`engine:`).
#
# La regla: **secreto → env; comportamiento → acá.** Este archivo se commitea:
# un token se NOMBRA (`${VAR}`) y el runner lo resuelve del ambiente al arrancar.
# El ambiente gana sobre este archivo (ver src/config/RunnerConfig.ts).

settings:
  # Puerto del servidor de webhooks (`--serve`). Env: IA_FLOW_SERVER_PORT.
  port: 3001
  # OpenTelemetry: trazas y logs por OTLP (ej. el Grafana LGTM local). Sin
  # endpoint no se exporta nada. Cada clave va a su OTEL_* y el ambiente gana:
  # endpoint → OTEL_EXPORTER_OTLP_ENDPOINT, serviceName → OTEL_SERVICE_NAME,
  # environment → OTEL_DEPLOYMENT_ENVIRONMENT, logLevel → LOG_LEVEL.
  telemetry:
    endpoint: http://localhost:4318
    serviceName: ai-development-flow-runner
    environment: local
    # debug | info | warn | error. En `debug` el provider anthropic-api vuelca
    # cada request y respuesta de la API, con las credenciales tapadas.
    logLevel: info

# Identidad de GitHub. `auto` usa la App si están los tres datos, si no
# GITHUB_TOKEN, si no `gh auth token`. `privateKeyPath` es la RUTA al PEM,
# relativa a este archivo (o `~/…`, o absoluta); el PEM en sí nunca se commitea
# (`*.pem` está en .gitignore). IA_FLOW_GITHUB_APP_PRIVATE_KEY_PATH la pisa.
github:
  mode: auto
  appId: "4752324"
  installationId: "157297744"
  privateKeyPath: ../github-app-private-key.pem

# Quién es cada persona en Slack: el login de GitHub → su usuario. `request_slack_review` taguea
# a los asignados del issue que estén acá, junto con los `slackReviewers` del repo. Se lee al
# arrancar el runner.
slack:
  users:
    julianjab: { id: U02M1QFA0AF, name: julianjab }

# Los defaults de cada provider para TODOS sus agentes; el `providerConfig` de un
# agente los pisa clave por clave. Los valida el provider al arrancar.
# `maxConcurrent` es del provider: cuántos agentes corren a la vez sobre él, entre
# todas las tasks (además del de cada agente y del de cada proyecto).
providers:
  anthropic-api:
    maxTokens: 32000
    maxToolRounds: 200
    maxPauseTurnRetries: 5
    maxConcurrent: 3
  # Un provider sobre el CLI `claude` (Claude Code): los agentes con
  # `provider: claude-cli` corren como una sesión del CLI en el worktree de la
  # task, con todo el CLI habilitado y sus actions por MCP. `mode: print`
  # (headless) o `tmux` (se mira con `tmux attach`; `surface: true` la abre en
  # iTerm). Usa CLAUDE_CODE_OAUTH_TOKEN del ambiente.
  claude-cli:
    type: claude-cli
    mode: print
    timeoutMinutes: 120
  # El mismo CLI en una sesión de tmux (`tmux attach -t iaflow-<agente>-task-<n>`).
  # Un agente con `providers: [claude-tmux, anthropic-api]` corre acá si hay
  # lugar, y si no en la API.
  claude-tmux:
    type: claude-cli
    mode: tmux
    timeoutMinutes: 120
    maxConcurrent: 2

# Los MCP que los agentes nombran en `mcpServers`. Uno que no responde al
# arrancar se omite con un aviso: Anthropic rechaza la request entera si un
# `mcp_servers` está caído, y eso tumbaría a todos los agentes que lo usan.
# `${GITHUB_TOKEN}` es SIEMPRE el installation token de la App.
mcp:
  - id: github-mcp
    config:
      type: http
      url: https://api.githubcopilot.com/mcp/
      authorizationToken: ${GITHUB_TOKEN}
  # El mismo MCP en solo lectura (`/readonly`: sólo las tools con `readOnlyHint`, ni
  # merge ni comentarios). Lo usa el asistente de la web: lee issues y PRs, y lo
  # que se mueve lo confirma una persona, firmado con su login.
  - id: github-mcp-readonly
    config:
      type: http
      url: https://api.githubcopilot.com/mcp/readonly
      authorizationToken: ${GITHUB_TOKEN}
  - id: figma-mcp
    config:
      type: http
      url: https://ia-flow-hooks.ss.lahaus.com/mcp/figma
      authorizationToken: ${FIGMA_MCP_TOKEN}
  # La memoria de los agentes entre corridas: el MCP oficial `server-memory` (un
  # grafo en <IA_FLOW_HOME>/memory.json) que levanta `bun run memory-mcp` en local y
  # publica un túnel de cloudflared (lo llama Anthropic: tiene que ser público).
  # La URL, con su path secreto, va en MEMORY_MCP_URL del .env; sin ella, los
  # agentes corren sin memoria.
  - id: memory-mcp
    config:
      type: http
      url: ${MEMORY_MCP_URL}

# El engine: cómo lo arma el runner (src/engine/mountEngine.ts).
# Las rutas son relativas a este archivo. Las fuentes no van acá: las monta el
# runner — la global (esta carpeta: pipelines/ y agents/) y una por proyecto
# (projects/<id>/), que sólo recibe los eventos con su `scope.projectId`.
engine:
  # Tope de la cadena de eventos derivados (un paso que emite otro evento).
  maxEventDepth: 10

  # Cada corrida con agentes es una EJECUCIÓN de su task: una task nunca corre
  # dos a la vez, y las pausas (esperar el CI) sobreviven a un reinicio porque
  # viven en SQLite. `bun-sqlite` lo registra el runner (src/storage/). Sin
  # `path`, la base es <IA_FLOW_HOME>/runner.sqlite (default
  # ~/.local/state/ia-flow/runner): el runner no escribe al lado de su config.
  executions:
    driver: bun-sqlite
    # Cuántas corridas en paralelo, entre todas las tasks.
    maxConcurrent: 5

  # Cada cuánto se revisan las pausas vencidas (`timeout` de un `pause`).
  tick:
    everyMs: 60000

  # Cómo le llega a un agente que ya corre un evento que acepta (`injects`): el
  # texto que arma `resolve_task` en `payload.message`.
  formatMessage: '{{message}}'

  # Las pipelines con `ifRunning: interrupt` (un cambio de status con un agente
  # trabajando): el agente recibe un aviso, cede el turno contando en qué quedó,
  # no sigue sus salidas y corre el `onInterrupt` del proyecto.
  interrupt:
    # Qué pasó, contra el payload del evento: lo lee el agente y va al comentario.
    reason: 'la card pasó de {{from}} a {{to}}'
    # Regex sobre quién movió la card (`sender`): el eco de un cambio del propio
    # runner (su App) nunca interrumpe. Las transiciones las hacen las rutas,
    # fuera del loop del agente, pero un agente podría mover la card con una tool.
    ownSenders: '\[bot\]$'

# Qué corre: la composición del runner (el engine sólo ve fuentes ya armadas).
# Cada lista acepta, sola o en lista, un directorio, un archivo, un glob en el
# nombre (`./pipelines/0*.yaml`) o el documento inline; las rutas son relativas
# a este archivo. Editar estas listas recarga las fuentes sin reiniciar.
sources:
  # La fuente global: recibe todos los eventos. Son los webhooks crudos de
  # GitHub (`github.<evento>`) → el evento de su task, con `resolve_task`
  # (src/intake/ del runner): encuentra la task (el issue detrás de un item del board,
  # el que implementa el PR de un comentario, la rama `<prefijo><n>` de un CI),
  # decide de qué proyecto es, la lee de GitHub —card, issue, blockers,
  # comentarios, PR, CI— y publica el evento de la task con su scope:
  #
  #   projects_v2_item      → issue.created · issue.status_changed · projects_v2_item.edited
  #   issue_comment         → issue_comment
  #   pull_request(_review) → pull_request · pull_request_review
  #   check_suite, workflow_run (completed) → check_suite · workflow_run
  #
  # No publica nada para un repo fuera del catálogo, ni para una card de otro
  # board o sin la `label` del proyecto (project.yaml): esas son del engine de
  # producción.
  pipelines:
    - id: intake
      on:
        - github.projects_v2_item
        - github.issue_comment
        - github.pull_request
        - github.pull_request_review
        - github.check_suite
        - github.workflow_run
      do:
        - action: resolve_task

    # La respuesta de una persona en el hilo de un pedido de review (Socket Mode, `SLACK_APP_TOKEN`):
    # `resolve_task` la lleva a su task —el issue y el PR salen del mensaje que abrió el hilo— y la
    # publica como un comentario del issue, que atiende `50-comment.yaml` como cualquier otro.
    - id: intake-slack
      on: [slack.message]
      when:
        - { field: isThreadReply, op: eq, value: true }
      do:
        - action: resolve_task

    # Un PR mergeado destraba las tasks que su issue bloqueaba (`mark_blocked_by`):
    # cada una que quedó sin otro blocker abierto recibe `issue.unblocked`, y la
    # pipeline de reentrada de su columna la retoma.
    - id: intake-unblock
      on: [github.pull_request]
      when:
        - { field: action, op: eq, value: closed }
        - { field: pull_request.merged, op: eq, value: true }
      do:
        - action: resolve_task
          with: { unblockDependents: true }

  # Los agentes de la fuente global: los que cumplen capacidades (abajo).
  agents: ./agents

  # Lo que el engine le pide a un modelo sin atarse a cuál: quién cumple cada
  # capacidad es un paso de esta fuente (un agente con un modelo chico). Sin
  # una, esa capacidad está apagada: un `whenText` no deja correr nada y
  # `fs_read` ignora `focus`.
  capabilities:
    # El gate semántico de pipelines y pasos (`whenText`).
    whenText: { agent: text-classifier }
    # `fs_read` con `focus` sobre un archivo grande: sólo las partes pedidas.
    fileFocus: { agent: file-focus }
    # El nombre de la rama de una task en un proyecto sin `branchPrefix`
    # (`feat/<slug>`, como ia-flow). Sin esto, `task/<número>`.
    branchName: { agent: branch-namer }
    # El asistente de la web (`POST /api/assistant`): lee la bandeja, las tareas, la
    # traza y la config, y propone acciones que la persona confirma. Sin esto, apagado.
    assistant: { agent: assistant }

  # Las actions estándar (GitHub, Slack, workspace, el intake, el asistente) vienen
  # con el runner (src/actions/builtin/). Acá sólo irían actions propias de este
  # deploy (código: sólo rutas), que las ve toda fuente; las de un proyecto van en
  # su project.yaml y ganan sobre éstas.

  # Cada proyecto: la ruta a su project.yaml, o el proyecto inline. Su fuente
  # sólo recibe los eventos con su `scope.projectId` (los que publica
  # `resolve_task`).
  projects:
    lahaus-ai-flow: ./projects/lahaus-ai-flow/project.yaml
