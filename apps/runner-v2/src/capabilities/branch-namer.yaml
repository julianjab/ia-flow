# Cumple la capacidad `branchName` (viene con el runner: `capabilities/index.ts`): el
# nombre de la rama de una task en un proyecto SIN `branchPrefix`, como lo hacía
# ia-flow — `<feat|fix|chore|refactor|docs>/<slug>`, sin número ni id: la rama se
# vincula al issue por API (`link_branch`), no por nombre. Sin esta capacidad,
# la task usa `task/<número>`.
#
# El engine le pasa `title`, `description` (recortada) y `type`, y espera
# `{ branch }` en `submit_done` bajo `result`.
id: branch-namer
provider: anthropic-api
providerConfig:
  model: claude-haiku-4-5
  maxTokens: 256
  maxToolRounds: 2
systemPrompts:
  - id: agentIdentity
  - text: >-
      Generás nombres de branch git para tasks. Respondé SÓLO llamando a
      `submit_done` con el nombre en `result.branch`.
  - id: untrusted-data
prompt: |
  Generá un nombre de branch git para esta task.

  Título: {{title}}
  Tipo: {{type}}
  Descripción (resumen): {{description}}

  Reglas estrictas:
  - Formato: <prefijo>/<slug-descriptivo>
  - Prefijo permitido: feat | fix | chore | refactor | docs (elegilo según tipo y descripción; functional → feat por defecto)
  - Slug: kebab-case, minúsculas, sin acentos, máximo 50 caracteres, describe la acción principal de forma concreta
  - Sin espacios, sin dobles guiones, sin puntos, sin comillas, sin markdown, sin sufijos numéricos ni ids
  - La branch se vincula al issue por API (no por nombre): NO incluyas el id de la task ni el número de issue
