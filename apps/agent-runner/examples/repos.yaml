# Fuente estática para `repoRepo` en modo IA_FLOW_REPOS_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlRepoRepository.ts).
#
# `path` es OBLIGATORIO acá aunque el ejemplo no lea/escriba el repo
# localmente (escribe vía el MCP de GitHub, ver agents.yaml). Es plomería
# interna del engine: `AgentOrchestrator` intenta clonar y persistir el path
# la primera vez que ve un repo SIN `path` pero con
# `githubOwner`/`githubRepo`, y en modo YAML ese `repoRepo.upsert()` tira
# (read-only) en vez de persistir — declarar `path` de antemano evita que
# ese branch se dispare.
#
# `name` tiene que matchear el `repo` de source.config en projects.yaml.
# `projectId` tiene que matchear el `id` de projects.yaml. `workflow: main`
# porque este ejemplo no necesita un worktree local por task.
- name: your-repo
  projectId: example-project
  path: /data/repos/your-repo
  githubOwner: your-org
  githubRepo: your-repo
  workflow: main
