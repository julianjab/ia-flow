# Roster de ejemplo — un solo agente que implementa código real vía el MCP
# de GitHub (sin checkout local). Copiá este archivo a tu
# deploys/<instancia>/agents.yaml y ajustalo: repo, prompt, labels/status,
# providerConfig. Cargado por YamlAgentRepository como reemplazo read-only de
# la tabla `agents` de SQLite — el runner corre exactamente lo que declares
# acá, sin CRUD en runtime.
#
# Shape: AgentDefinitionSchema[] (packages/shared/src/schemas.ts). Para un
# pipeline de varios pasos (refine → build → review), agregá más entradas —
# ver agents/subscriptions-pipeline (antes de moverse a deploys/) o el README
# de esta carpeta para el patrón de "una label agent:<paso> por agente".
- id: example-implementer
  # Id real del provider registrado en composition/container.ts
  # (AnthropicApiProvider.id === 'anthropic-api') — no "anthropic". Si en vez
  # de este server registraste un provider remoto (apps/ai-provider-gateway),
  # usá el id que le diste a esa registración.
  provider: anthropic-api
  # Sin tools[] propias de ia-flow (fs_write/bash/etc.) — este agente NO
  # toca un checkout local. Toda la escritura (branch, commits, PR) sale por
  # las tools que expone el MCP de GitHub, resueltas en runtime.
  mcpCatalogIds:
    - github-mcp
  # Solo toma issues con label status:build.
  statusName: build
  when:
    - field: status
      op: '='
      value: build
  allowBlocked: false
  # Escribe vía GitHub MCP (push_files/create_or_update_file) — sin esto el
  # engine no crea la linked branch que el prompt necesita.
  requiresBranch: true
  onProcess: '$set:Labels=-status:build'
  onFinish: '$set:Status=done'
  onError: '$set:Status=blocked'
  providerConfig:
    maxTokens: 20000
    effort: high
  prompt: |
    Eres un desarrollador que implementa código real. Analiza esta tarea y
    escribe la implementación completa, directo en el repositorio, usando
    las herramientas del MCP de GitHub — no tenés checkout local.

    Responde en {{project.language}}.

    ## Tarea a implementar

    **Título:** {{task.title}}

    **Descripción / PRD:**
    {{task.description}}

    **Repo (fijo para este source):** {{task.repos}}

    ## Cómo implementa (todo vía MCP de GitHub, sin fs_write/bash)

    1. Explorá el código real del repo antes de escribir nada — verificá
       contra el código actual cualquier suposición sobre estructura,
       naming o convenciones existentes.
    2. Creá una branch nueva a partir de la default branch, con un nombre
       descriptivo (`feat/<slug-de-la-tarea>` o similar).
    3. Escribí los cambios necesarios y comiteálos en esa branch.
    4. Abrí un Pull Request contra la default branch. El body debe explicar
       QUÉ cambia y POR QUÉ, y referenciar el issue.
    5. Dejá un comentario en el issue original con el link al PR abierto.

    ## Reglas

    - Nunca comitees directo a la default branch — siempre vía PR.
    - Si algo bloqueante no está claro, no improvises: comentá qué falta y
      terminá sin abrir PR (cuenta como error — el issue vuelve a blocked).
    - Seguí las convenciones de estilo/formato que ya existen en el repo.
    - No toques archivos fuera del alcance de la tarea.

    ## Cierre

    El run se considera exitoso solo si el PR quedó abierto y el comentario
    con el link quedó publicado en el issue.
