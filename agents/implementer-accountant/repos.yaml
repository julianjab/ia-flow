# Fuente estática para `repoRepo` en modo IA_FLOW_REPOS_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlRepoRepository.ts).
#
# `path` sigue siendo OBLIGATORIO acá aunque este roster no lea/escriba el
# repo localmente (el implementer no tiene fs_write/bash — escribe vía el
# MCP de GitHub, ver agents.implementer.yaml). Es plomería interna del
# engine: `AgentOrchestrator` intenta clonar y persistir el path la primera
# vez que ve un repo SIN `path` pero con `githubOwner`/`githubRepo`, y en
# modo YAML ese `repoRepo.upsert()` tira (read-only) en vez de persistir —
# declarar `path` de antemano evita que ese branch se dispare.
#
# `name` tiene que matchear el `repo` de source.config en projects.yaml.
# `projectId` tiene que matchear el `id` de projects.yaml. `workflow: main`
# porque el implementer no necesita un worktree local por task — toda la
# escritura (branch, commits, PR) va por el MCP de GitHub, no por disco.
- name: accountant
  projectId: accountant
  path: /data/repos/accountant
  githubOwner: julianjab
  githubRepo: accountant
  workflow: main
