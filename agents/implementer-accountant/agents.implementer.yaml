# Roster fijo para el "engine" de solo-implementación contra
# github.com/julianjab/accountant (ver ../../Dockerfile). Cargado por
# YamlAgentRepository como reemplazo read-only de la tabla `agents` de
# SQLite: este contenedor corre exactamente el agente definido acá, sin CRUD
# en runtime.
#
# Editar este archivo y reconstruir/re-montar el volumen es la única forma
# de cambiar el roster en este modo — ver README.md.
#
# Shape: AgentDefinitionSchema[] (packages/shared/src/schemas.ts).
- id: accountant-implementer
  # Id real del provider registrado en composition/container.ts
  # (AnthropicApiProvider.id === 'anthropic-api') — no "anthropic".
  provider: anthropic-api
  # Sin tools[] propias de ia-flow (fs_write/bash/etc.) — este agente NO
  # toca un checkout local. Toda la escritura de código (branch, commits,
  # archivos, PR) sale por las tools que expone el MCP de GitHub vía
  # mcpCatalogIds, resueltas en runtime por el proveedor LLM.
  mcpCatalogIds:
    - github-mcp
  # Solo toma issues con label status:build.
  statusName: build
  # Condición explícita, redundante a propósito con statusName de arriba
  # (defensa en profundidad): solo corre cuando status vale exactamente
  # "build". `condToOp` (packages/agent-engine/src/outcomes.ts) devuelve
  # `value` tal cual para cualquier op que no sea `!=`/`$null`/`$not_null`,
  # así que este op puede ser cualquier string no reservado — usamos '='
  # por legibilidad, no porque el DSL lo interprete como comparador.
  when:
    - field: status
      op: '='
      value: build
  # Un issue bloqueado por dependencias sin terminar debe frenar acá — a
  # diferencia del refiner, "build" sí depende de que el resto del pipeline
  # (refine/approve) haya cerrado antes de escribir código real.
  allowBlocked: false
  # Escribe vía GitHub MCP (push_files/create_or_update_file), no vía
  # write_file/edit_file locales — sin esto el engine no crea la linked
  # branch que el prompt necesita para no comitear directo a main.
  requiresBranch: true
  # Este source es github-issues → el status vive en un label (`status:*`,
  # StatusLabelCodec), así que la mutación va por el DSL de labels
  # (`$labels:`, applyLabelOps en outcomes.ts), no por `$set:Status=...`.
  # Al arrancar el run, saca `status:build` y no pone ningún label de status
  # en su lugar — mientras corre, el issue queda sin `status:*` (visible en
  # GitHub como "se lo llevaron de build, todavía no volvió"). Como no hay
  # un status intermedio tipo "working" acá, ningún otro agente puede
  # matchear este issue por accidente durante el run.
  onProcess: '$set:Labels=-status:build'
  # Al terminar sin errores (el agente ya abrió el PR dentro del prompt) —
  # mueve el issue a done. El engine aplica esto automáticamente cuando el
  # run termina sin excepción, el agente no llama set_task_field para esto.
  onFinish: '$set:Status=done'
  # Cualquier falla (branch/push/PR rechazados, excepción del provider) deja
  # el issue en blocked para revisión manual — no reintenta solo.
  onError: '$set:Status=blocked'
  # Opcional — sin esto, el provider usa DEFAULT_ANTHROPIC_SETTINGS de
  # @ia-flow/ai-providers. Implementar código real suele necesitar más
  # tokens/esfuerzo que refinar un PRD; ajustá según el tamaño típico de los
  # issues de este repo.
  providerConfig:
    maxTokens: 20000
    effort: high
  prompt: |
    Eres un desarrollador que implementa código real. Analiza esta tarea y
    escribe la implementación completa, directo en el repositorio, usando
    las herramientas del MCP de GitHub — no tenés checkout local.

    Responde en {{project.language}}.

    ## Tarea a implementar

    **Título:** {{task.title}}

    **Descripción / PRD:**
    {{task.description}}

    **Repo (fijo para este source):** {{task.repos}}

    ## Cómo implementa (todo vía MCP de GitHub, sin fs_write/bash)

    1. Explorá el código real del repo (buscar archivos, leer contenido,
       listar directorios) antes de escribir nada — verificá contra el
       código actual cualquier suposición sobre estructura, naming o
       convenciones existentes.
    2. Creá una branch nueva a partir de la default branch, con un nombre
       descriptivo (`feat/<slug-de-la-tarea>` o similar).
    3. Escribí los cambios necesarios (archivos nuevos y/o modificados) y
       comiteálos en esa branch — commits chicos y descriptivos, en vez de
       uno solo gigante si el cambio lo amerita.
    4. Abrí un Pull Request de esa branch contra la default branch. El
       título del PR debe reflejar la tarea; el body debe explicar QUÉ
       cambia y POR QUÉ, y referenciar el issue de la tarea
       (`Closes #{{task.number}}` o el identificador equivalente si está
       disponible).
    5. Dejá un comentario en el issue original con el link al PR abierto.

    ## Reglas

    - Nunca comitees directo a la default branch — siempre vía PR.
    - Si el PRD tiene preguntas abiertas bloqueantes o la tarea abarca más
      de un cambio coherente, no improvises la respuesta: dejá un
      comentario en el issue explicando qué falta definir y terminá sin
      abrir PR (esto cuenta como error — el issue vuelve a blocked).
    - Seguí las convenciones de estilo/formato que ya existen en el repo
      (verificalas leyendo archivos similares antes de escribir).
    - No toques archivos fuera del alcance de la tarea.

    ## Cierre

    El run se considera exitoso solo si el PR quedó abierto y el comentario
    con el link quedó publicado en el issue. Si algo de eso falla, terminá
    con un error explícito (no lo des por hecho en silencio) — el engine
    mueve el issue a blocked automáticamente.
