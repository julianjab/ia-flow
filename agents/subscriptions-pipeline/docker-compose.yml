# ia-flow — engine headless: un solo servicio con el pipeline de 3 agentes
# (refiner → implementer → ci-watcher) contra github.com/la-haus/subscriptions
# (agentes/proyecto/repo/mcp-catalog en YAML, ver Dockerfile + README.md).
#
# El server PRINCIPAL sigue corriendo en el host (`bun run start` /
# `bun run dev:server`), no en este compose. Sin `extra_hosts` — no hace
# falta: Podman (gvproxy) ya resuelve `host.containers.internal` de fábrica,
# apuntando al host, sin ningún --add-host/extra_hosts. `host.docker.internal`
# (el hostname "estilo Docker") SÍ necesita `extra_hosts:
# host.docker.internal:host-gateway`, y ese mecanismo tiene un bug conocido
# de Podman en macOS ("host containers internal IP address is empty") que en
# esta máquina no se arregla ni con `podman machine stop && podman machine
# start` — bloquea el `up` entero. `host.containers.internal` lo evita del
# todo: para el forward opcional de logs (IA_FLOW_REMOTE_LOG_URL), usá
#   IA_FLOW_REMOTE_LOG_URL=http://host.containers.internal:3001/api/remote-logs
# en tu `.env` (ya es el default en subscriptions.env.example). Con Docker
# Desktop en vez de Podman, `host.docker.internal` sí funciona sin bug si
# preferís esa forma — ahí sí haría falta el `extra_hosts` de arriba.
#
# Uso (desde esta carpeta, agents/subscriptions-pipeline/):
#   cp subscriptions.env.example .env   # completar valores reales
#   docker compose up -d --build
#   # o: podman compose up -d --build

services:
  subscriptions:
    build:
      # Repo entero: el Dockerfile necesita el workspace de Bun completo.
      context: ../..
      dockerfile: agents/subscriptions-pipeline/Dockerfile
    container_name: ia-flow-subscriptions-pipeline
    ports:
      # Único puerto expuesto: el proxy de webhooks (scripts/webhook-proxy.ts,
      # arrancado por entrypoint.sh), que sólo reenvía POST /api/webhooks/github
      # y responde 404 a todo lo demás. El puerto 3001 (la API completa, sin
      # auth propia) NO se publica al host — corré el túnel público (host)
      # apuntando a este puerto: `cloudflared tunnel --url http://localhost:8788`.
      #
      # Host 8788, no 8787: si en algún momento corrés este servicio junto a
      # agents/implementer-accountant (que ya usa 8787) en la misma máquina,
      # no chocan.
      - "127.0.0.1:8788:8787"
    volumes:
      - ia-flow-subscriptions-data:/data
      # Bind-mounts opcionales para editar cualquiera de los YAML de config
      # sin rebuild — ver README.
      # - ./agents.subscriptions.yaml:/app/config/agents.yaml:ro
      # - ./projects.yaml:/app/config/projects.yaml:ro
      # - ./repos.yaml:/app/config/repos.yaml:ro
      # - ./mcp-catalog.yaml:/app/config/mcp-catalog.yaml:ro
    environment:
      # Default del daemon es `webhook` (ver apps/server/CLAUDE.md) — necesita
      # que el proxy + un túnel corrido a mano en el host lleguen hasta acá.
      # IA_FLOW_WEBHOOK_SECRET queda sin `:?required` a propósito: si no viene
      # por .env, entrypoint.sh genera uno y lo persiste en /data/webhook-secret
      # (sobrevive a restarts).
      # buildAnthropicAuthHeader (packages/ai-providers/src/anthropic-api/auth.ts)
      # prioriza CLAUDE_CODE_OAUTH_TOKEN sobre ANTHROPIC_API_KEY si las dos
      # están seteadas — este deploy usa el token OAuth, no la API key.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?falta CLAUDE_CODE_OAUTH_TOKEN en .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?falta GITHUB_TOKEN en .env}
      IA_FLOW_WEBHOOK_SECRET: ${IA_FLOW_WEBHOOK_SECRET:-}
      # Pino level (apps/server/src/logger.ts) — trace/debug/info/warn/error/fatal.
      # Default info si no lo seteás en .env.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Sin default a host.docker.internal — ver nota de extra_hosts arriba.
      # Vacío = sin forward, el contenedor solo loguea a su propio /data/logs.
      IA_FLOW_REMOTE_LOG_URL: ${IA_FLOW_REMOTE_LOG_URL:-}
      IA_FLOW_REMOTE_LOG_TOKEN: ${IA_FLOW_REMOTE_LOG_TOKEN:-}
    restart: unless-stopped

volumes:
  ia-flow-subscriptions-data:
