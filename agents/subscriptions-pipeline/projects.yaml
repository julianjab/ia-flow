# Fuente estática para `projectRepo` en modo IA_FLOW_PROJECT_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlProjectRepository.ts).
#
# `id` tiene que matchear el `projectId` usado en repos.yaml.
#
# `anchorLabel: ia-flow` — creá esta label en github.com/la-haus/subscriptions
# y ponela en los issues que querés que este roster tome. Es un concepto
# aparte de los labels `agent:refine`/`agent:build`/`agent:review` (ver
# agents.subscriptions.yaml, gateados por `when`, no por `statusName`/
# StatusLabelCodec): la ancla decide qué issues entran al pipeline de
# ia-flow en general, el label `agent:*` decide en qué paso están.
#
# Statuses, system prompts reusables (SystemPromptDef) y prompts NO tienen
# su propio archivo acá salvo mcp-catalog.yaml (los 3 agentes de este roster
# lo usan — leen y escriben el repo vía el MCP de GitHub, no vía
# fs_read/fs_write/bash). Esos otros quedan en SQLite por default, sin que
# nadie los toque.
#
# `settings.systemPrompt` — texto que se manda como system prompt de
# Anthropic a LOS 3 AGENTES de este proyecto automáticamente, sin que cada
# uno tenga que declarar nada (ver ProjectSettingsSchema.systemPrompt en
# packages/shared/src/schemas.ts y resolveSystemPromptBlocks en
# packages/agent-engine/src/system-prompt-blocks.ts). Es el lugar correcto
# para reglas transversales al pipeline entero; si un agente puntual
# necesita algo propio además de esto, usa su `inlineSystemPrompt` (texto) o
# `systemPrompts: [id]` (referencia a un SystemPromptDef reusable) —
# `agents.subscriptions.yaml` no usa ninguno de los dos hoy porque esto solo
# alcanza.
- id: subscriptions
  name: subscriptions
  language: español
  settings:
    systemPrompt: |
      Formás parte de un pipeline automatizado de ia-flow para
      la-haus/subscriptions (refiner → implementer → ci-watcher). Trabajás
      sin checkout local, exclusivamente vía el MCP oficial de GitHub.

      Reglas transversales, válidas sin importar qué paso del pipeline seas:

      - Respondé siempre en español.
      - Nunca mergees un Pull Request, ni sugieras que se mergee — eso lo
        decide siempre un humano.
      - No toques ni leas repos distintos a la-haus/subscriptions.
      - Ante ambigüedad real o un bloqueo que no te corresponde resolver,
        preferí fallar explícito (`fail_task` con el detalle) antes que
        improvisar una decisión de producto o arquitectura.
      - Sé conservador: un cambio chico y verificable es mejor que uno
        grande que no podés confirmar vos mismo (no tenés bash ni tests
        locales).
  source:
    kind: github-issues
    config:
      owner: la-haus
      repo: subscriptions
      anchorLabel: ia-flow
