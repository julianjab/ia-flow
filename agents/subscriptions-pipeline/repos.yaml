# Fuente estática para `repoRepo` en modo IA_FLOW_REPOS_REPO=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlRepoRepository.ts).
#
# `path` sigue siendo OBLIGATORIO acá aunque ningún agente de este roster
# lea/escriba el repo localmente (todos son MCP-only, ver
# agents.subscriptions.yaml). Es plomería interna del engine:
# `AgentOrchestrator` intenta clonar y persistir el path la primera vez que
# ve un repo SIN `path` pero con `githubOwner`/`githubRepo`, y en modo YAML
# ese `repoRepo.upsert()` tira (read-only) en vez de persistir — declarar
# `path` de antemano evita que ese branch se dispare.
#
# `name` tiene que matchear el `repo` de source.config en projects.yaml.
# `projectId` tiene que matchear el `id` de projects.yaml. `workflow: main`
# porque ningún agente necesita un worktree local por task — toda la
# escritura (branch, commits, PR) va por el MCP de GitHub.
- name: subscriptions
  projectId: subscriptions
  path: /data/repos/subscriptions
  githubOwner: la-haus
  githubRepo: subscriptions
  workflow: main
