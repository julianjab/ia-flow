# Fuente estática para `statusRepo` en modo IA_FLOW_REPO_SOURCE=yaml (ver
# apps/server/src/infrastructure/db/yaml/YamlStatusRepository.ts).
#
# `projectId` tiene que matchear el `id` declarado en projects.yaml. Los
# nombres acá abajo son los que agents.refiner.github-issues.yaml usa en
# `statusName`/`onFinish`/`onError` — si cambiás uno de los dos lados,
# cambiá el otro. La comparación status↔label de GitHub es case-insensitive
# (ver StatusLabelCodec), así que el casing acá no importa para el matching,
# solo para lo que se muestra.
- name: refine
  projectId: functional-refiner
  position: 0
  allowBlocked: true
- name: refined
  projectId: functional-refiner
  position: 1
- name: blocked
  projectId: functional-refiner
  position: 2
